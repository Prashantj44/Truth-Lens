<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TruthLens — Explainable Fact Verification Engine</title>
  
  <!-- Modern Editorial & Precision Sans Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Inter"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- React 18, ReactDOM & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    *, *::before, *::after {
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.15s ease;
    }

    body {
      background-color: #F8FAFC;
      color: #0F172A;
      font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
    }

    html.dark body {
      background-color: #0B0F17;
      color: #F8FAFC;
    }

    /* Light Theme Surfaces */
    .surface-card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04), 0 6px 20px -4px rgba(15, 23, 42, 0.03);
    }
    .surface-card:hover {
      border-color: #CBD5E1;
    }

    /* Dark Theme Surfaces */
    html.dark .surface-card {
      background: #131B2A;
      border: 1px solid #1E293B;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    html.dark .surface-card:hover {
      border-color: #334155;
    }

    /* Omnibox High-Focus Card */
    .omnibox-surface {
      background: #FFFFFF;
      border: 1.5px solid #CBD5E1;
      box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.08), 0 0 0 1px rgba(15, 23, 42, 0.02);
    }
    .omnibox-surface:focus-within {
      border-color: #0F172A;
      box-shadow: 0 15px 40px -5px rgba(15, 23, 42, 0.12), 0 0 0 3px rgba(15, 23, 42, 0.08);
    }

    html.dark .omnibox-surface {
      background: #111827;
      border: 1.5px solid #1F2937;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
    }
    html.dark .omnibox-surface:focus-within {
      border-color: #60A5FA;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 0 3px rgba(96, 165, 250, 0.15);
    }

    .ticker-move {
      display: inline-block;
      white-space: nowrap;
      animation: ticker 42s linear infinite;
    }
    @keyframes ticker {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-50%, 0, 0); }
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 9999px; }
    html.dark ::-webkit-scrollbar-thumb { background: #334155; }
  </style>
</head>
<body class="min-h-screen antialiased selection:bg-slate-800 selection:text-white dark:selection:bg-white dark:selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Minimalist Precision Icons ---
    const Icon = ({ name, className = "w-4 h-4" }) => {
      switch (name) {
        case 'shield':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>;
        case 'lens':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><circle cx="11" cy="11" r="8" strokeWidth="2" /><path strokeLinecap="round" strokeWidth="2" d="M21 21l-4.35-4.35M11 8a3 3 0 00-3 3" /></svg>;
        case 'database':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4" /></svg>;
        case 'history':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;
        case 'chart':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>;
        case 'settings':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>;
        case 'check':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 13l4 4L19 7" /></svg>;
        case 'x':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M6 18L18 6M6 6l12 12" /></svg>;
        case 'alert':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>;
        case 'help':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;
        case 'trash':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>;
        case 'upload':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>;
        case 'sparkles':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>;
        case 'link':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" /></svg>;
        case 'message':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>;
        case 'copy':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>;
        case 'arrow-right':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>;
        case 'zap':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>;
        case 'book':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>;
        case 'sun':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>;
        case 'moon':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>;
        default:
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><circle cx="12" cy="12" r="10" strokeWidth="2" /></svg>;
      }
    };

    // --- Semantic, Highly Legible Verdict Badges ---
    const VerdictBadge = ({ verdict, size = "md" }) => {
      const cfg = {
        'SUPPORTED': {
          label: 'VERIFIED TRUE',
          sub: 'Confirmed by authoritative evidence in indexed dossiers',
          border: 'border-emerald-300 dark:border-emerald-800/80',
          bg: 'bg-emerald-50 text-emerald-900 dark:bg-emerald-950/60 dark:text-emerald-200',
          dot: 'bg-emerald-600 dark:bg-emerald-400',
          badgeText: 'text-emerald-700 dark:text-emerald-300',
        },
        'REFUTED': {
          label: 'DEBUNKED / FALSE',
          sub: 'Directly contradicted by official records & evidence',
          border: 'border-rose-300 dark:border-rose-800/80',
          bg: 'bg-rose-50 text-rose-900 dark:bg-rose-950/60 dark:text-rose-200',
          dot: 'bg-rose-600 dark:bg-rose-400',
          badgeText: 'text-rose-700 dark:text-rose-300',
        },
        'MISLEADING': {
          label: 'MISLEADING / MIXED',
          sub: 'Contains partial truth but lacks vital context or nuances',
          border: 'border-amber-300 dark:border-amber-800/80',
          bg: 'bg-amber-50 text-amber-900 dark:bg-amber-950/60 dark:text-amber-200',
          dot: 'bg-amber-600 dark:bg-amber-400',
          badgeText: 'text-amber-700 dark:text-amber-300',
        },
        'INSUFFICIENT EVIDENCE': {
          label: 'UNVERIFIED CLAIM',
          sub: 'Insufficient reliable documentation found to verify',
          border: 'border-slate-300 dark:border-slate-700',
          bg: 'bg-slate-100 text-slate-800 dark:bg-slate-850 dark:text-slate-200',
          dot: 'bg-slate-500 dark:bg-slate-400',
          badgeText: 'text-slate-700 dark:text-slate-300',
        }
      }[verdict] || {
        label: verdict || 'UNKNOWN',
        sub: 'Pending analysis',
        border: 'border-slate-300 dark:border-slate-700',
        bg: 'bg-slate-100 text-slate-800 dark:bg-slate-850 dark:text-slate-200',
        dot: 'bg-slate-500 dark:bg-slate-400',
        badgeText: 'text-slate-700 dark:text-slate-300',
      };

      if (size === "lg") {
        return (
          <div className={`px-5 py-3.5 rounded-2xl border ${cfg.border} ${cfg.bg} flex items-center gap-4 shadow-sm`}>
            <div className={`w-3.5 h-3.5 rounded-full ${cfg.dot} shrink-0 animate-pulse`}></div>
            <div>
              <div className={`text-base sm:text-lg font-bold tracking-tight font-sans ${cfg.badgeText}`}>{cfg.label}</div>
              <div className="text-xs text-slate-600 dark:text-slate-400 font-sans mt-0.5">{cfg.sub}</div>
            </div>
          </div>
        );
      }

      return (
        <span className={`inline-flex items-center gap-2 px-3 py-1 rounded-lg border ${cfg.border} ${cfg.bg} text-xs font-semibold`}>
          <span className={`w-2 h-2 rounded-full ${cfg.dot}`}></span>
          <span className={cfg.badgeText}>{cfg.label}</span>
        </span>
      );
    };

    // --- Evidence Card Designed for Reading Comfort ---
    const EvidenceChunkCard = ({ chunk }) => {
      const isSupport = chunk.stance === 'SUPPORT';
      const isContradict = chunk.stance === 'CONTRADICT';

      return (
        <div className={`p-5 rounded-2xl border transition-all space-y-3.5 ${
          isSupport 
            ? 'bg-emerald-50/50 dark:bg-emerald-950/20 border-emerald-200 dark:border-emerald-900/60' 
            : isContradict 
            ? 'bg-rose-50/50 dark:bg-rose-950/20 border-rose-200 dark:border-rose-900/60' 
            : 'bg-slate-50/80 dark:bg-slate-900/40 border-slate-200 dark:border-slate-800'
        }`}>
          <div className="flex items-center justify-between gap-2 text-xs font-mono">
            <span className={`px-2.5 py-1 rounded-md text-[11px] font-bold tracking-wide border ${
              isSupport 
                ? 'bg-emerald-100 dark:bg-emerald-900/70 text-emerald-900 dark:text-emerald-200 border-emerald-300 dark:border-emerald-700' 
                : isContradict 
                ? 'bg-rose-100 dark:bg-rose-900/70 text-rose-900 dark:text-rose-200 border-rose-300 dark:border-rose-700' 
                : 'bg-slate-200/80 dark:bg-slate-800 text-slate-800 dark:text-slate-300 border-slate-300 dark:border-slate-700'
            }`}>
              {isSupport ? '✓ CORROBORATING EVIDENCE' : isContradict ? '✗ REFUTING EVIDENCE' : 'ℹ CONTEXTUAL EXCERPT'}
            </span>
            <span className="text-slate-500 dark:text-slate-400 font-medium">
              Match: <strong className="text-slate-800 dark:text-slate-200">{chunk.relevance_score != null ? Math.round(chunk.relevance_score) : (chunk.similarity_score != null ? Math.round(chunk.similarity_score) : 85)}%</strong>
            </span>
          </div>

          <p className="text-[15px] text-slate-800 dark:text-slate-200 leading-relaxed font-sans font-normal">
            "{chunk.text}"
          </p>

          <div className="flex flex-wrap items-center justify-between gap-2 pt-2.5 border-t border-slate-200/70 dark:border-slate-800/80 text-xs text-slate-500 dark:text-slate-400">
            <span className="truncate max-w-[280px] font-medium text-slate-700 dark:text-slate-300">
              📄 {chunk.document_name}
            </span>
            <span className="font-mono">Credibility: <strong className="text-slate-700 dark:text-slate-300">{chunk.credibility_score}%</strong></span>
          </div>
        </div>
      );
    };

    // --- Main Application Component ---
    function App() {
      const [darkMode, setDarkMode] = useState(() => {
        return localStorage.getItem('truthlens_theme') === 'dark';
      });

      const [activeTab, setActiveTab] = useState('verify');
      const [inputMode, setInputMode] = useState('text'); // 'text', 'url', 'forward'
      
      const [claimInput, setClaimInput] = useState('');
      const [urlInput, setUrlInput] = useState('');
      const [forwardInput, setForwardInput] = useState('');
      
      const [selectedProvider, setSelectedProvider] = useState('fallback');
      const [apiKeyInput, setApiKeyInput] = useState('');
      
      const [verifying, setVerifying] = useState(false);
      const [progressStep, setProgressStep] = useState(0);
      const [extractingUrl, setExtractingUrl] = useState(false);
      const [cleaningForward, setCleaningForward] = useState(false);
      const [syncingNews, setSyncingNews] = useState(false);
      const [trainingDataset, setTrainingDataset] = useState(false);
      const [seeding, setSeeding] = useState(false);
      
      const [currentResult, setCurrentResult] = useState(null);
      const [trendingFilter, setTrendingFilter] = useState('ALL');
      const [trendingClaims, setTrendingClaims] = useState([]);
      const [health, setHealth] = useState(null);
      const [documents, setDocuments] = useState([]);
      const [history, setHistory] = useState([]);
      const [analytics, setAnalytics] = useState(null);
      const [newsStatus, setNewsStatus] = useState(null);
      const [toast, setToast] = useState(null);

      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      // Sync dark mode class with HTML element
      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
          localStorage.setItem('truthlens_theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          localStorage.setItem('truthlens_theme', 'light');
        }
      }, [darkMode]);

      const toggleTheme = () => setDarkMode(!darkMode);

      const showToast = (msg, type = 'info') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 4000);
      };

      useEffect(() => {
        loadHealth();
        loadDocuments();
        loadHistory();
        loadAnalytics();
        loadNewsStatus();
        loadTrendingClaims();
      }, []);

      const loadHealth = async () => {
        try {
          const res = await fetch('/api/health');
          const data = await res.json();
          setHealth(data);
        } catch (e) {
          console.error(e);
        }
      };

      const loadDocuments = async () => {
        try {
          const res = await fetch('/api/documents');
          const data = await res.json();
          setDocuments(data);
        } catch (e) {
          console.error(e);
        }
      };

      const loadHistory = async () => {
        try {
          const res = await fetch('/api/history?limit=50');
          const data = await res.json();
          setHistory(data);
        } catch (e) {
          console.error(e);
        }
      };

      const loadAnalytics = async () => {
        try {
          const res = await fetch('/api/analytics');
          const data = await res.json();
          setAnalytics(data);
        } catch (e) {
          console.error(e);
        }
      };

      const loadNewsStatus = async () => {
        try {
          const res = await fetch('/api/news/status');
          const data = await res.json();
          setNewsStatus(data);
        } catch (e) {
          console.error(e);
        }
      };

      const loadTrendingClaims = async () => {
        try {
          const res = await fetch('/api/news/trending');
          const data = await res.json();
          if (Array.isArray(data)) {
            setTrendingClaims(data);
          }
        } catch (e) {
          console.error(e);
        }
      };

      // Handle Core Claim Verification (Only triggered when user clicks "Verify Claim" or presses Ctrl+Enter)
      const handleVerify = async (claimToVerify) => {
        const text = (claimToVerify || claimInput).trim();
        if (!text) {
          showToast('Please enter a claim or statement to verify.', 'error');
          return;
        }

        setVerifying(true);
        setCurrentResult(null);
        setProgressStep(1);

        const stepTimer1 = setTimeout(() => setProgressStep(2), 300);
        const stepTimer2 = setTimeout(() => setProgressStep(3), 700);
        const stepTimer3 = setTimeout(() => setProgressStep(4), 1100);

        try {
          const res = await fetch('/api/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              claim: text,
              llm_provider: selectedProvider,
              api_key: apiKeyInput || null
            })
          });

          if (!res.ok) {
            const err = await res.json();
            throw new Error(err.detail || 'Verification failed');
          }

          const data = await res.json();
          setCurrentResult(data);
          loadHealth();
          loadHistory();
          loadAnalytics();
          showToast(`Audit Completed: ${data.verdict}`, 'success');
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          clearTimeout(stepTimer1);
          clearTimeout(stepTimer2);
          clearTimeout(stepTimer3);
          setVerifying(false);
          setProgressStep(0);
        }
      };

      // Handle URL Extraction (Loads headline into editor WITHOUT auto-verifying)
      const handleExtractUrl = async () => {
        const u = urlInput.trim();
        if (!u) {
          showToast('Please enter an online news article URL.', 'error');
          return;
        }
        setExtractingUrl(true);

                                onClick={() => handleDeleteDoc(doc.id, doc.title)}
                                className="p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 hover:text-slate-900 dark:hover:text-white transition-colors"
                                title="Delete document"
                              >
                                <Icon name="trash" className="w-4 h-4" />
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

              </div>
            )}

            {/* ======================================================== */}
            {/* TAB 3: AUDIT HISTORY                                     */}
            {/* ======================================================== */}
            {activeTab === 'history' && (
              <div className="max-w-5xl w-full mx-auto space-y-6">
                <div>
                  <h2 className="text-2xl sm:text-3xl font-bold text-slate-900 dark:text-white font-sans">Fact-Checking Audit History</h2>
                  <p className="text-sm sm:text-base text-slate-600 dark:text-slate-400 mt-1">
                    Complete audit trail of all verified claims, confidence ratings, and evidence matches.
                  </p>
                </div>

                <div className="surface-card rounded-2xl p-6">
                  {history.length > 0 ? (
                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-xs sm:text-sm">
                        <thead className="border-b border-slate-200 dark:border-slate-800 text-slate-500 dark:text-slate-400 font-mono">
                          <tr>
                            <th className="pb-3 px-3 font-semibold">Claim Statement</th>
                            <th className="pb-3 px-3 font-semibold">Verdict</th>
                            <th className="pb-3 px-3 font-semibold">Confidence</th>
                            <th className="pb-3 px-3 font-semibold">Provider</th>
                            <th className="pb-3 px-3 font-semibold">Timestamp</th>
                            <th className="pb-3 px-3 text-right font-semibold">Action</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100 dark:divide-slate-800 text-slate-700 dark:text-slate-300 font-mono">
                          {history.map((h) => (
                            <tr key={h.id} className="hover:bg-slate-50 dark:hover:bg-slate-850/40">
                              <td className="py-3 px-3 font-sans font-semibold text-slate-900 dark:text-white max-w-xs truncate">
                                "{h.claim}"
                              </td>
                              <td className="py-3 px-3">
                                <VerdictBadge verdict={h.verdict} size="sm" />
                              </td>
                              <td className="py-3 px-3 font-bold text-slate-900 dark:text-white">{h.confidence_score}%</td>
                              <td className="py-3 px-3 text-slate-500">{h.llm_provider}</td>
                              <td className="py-3 px-3 text-slate-500">{h.created_at?.slice(0, 16)}</td>
                              <td className="py-3 px-3 text-right">
                                <button
                                  onClick={() => {
                                    setClaimInput(h.claim);
                                    setActiveTab('verify');
                                    setCurrentResult(null);
                                    showToast('Loaded audit into editor. Click "Verify Claim" to audit.', 'info');
                                    const el = document.getElementById('claim-editor');
                                    if (el) el.focus();
                                  }}
                                  className="px-3 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-900 hover:text-white dark:hover:bg-white dark:hover:text-slate-900 text-slate-800 dark:text-slate-200 text-xs font-semibold transition-all border border-slate-200 dark:border-slate-700 shadow-sm"
                                >
                                  Load
                                </button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  ) : (
                    <div className="text-center py-12 text-slate-500 font-mono text-sm">
                      No audit history records found yet. Run your first claim verification above!
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* ======================================================== */}
            {/* TAB 4: ANALYTICS & METRICS                               */}
            {/* ======================================================== */}
            {activeTab === 'analytics' && (
              <div className="max-w-5xl w-full mx-auto space-y-6">
                <div>
                  <h2 className="text-2xl sm:text-3xl font-bold text-slate-900 dark:text-white font-sans">Verification Engine Analytics</h2>
                  <p className="text-sm sm:text-base text-slate-600 dark:text-slate-400 mt-1">
                    Telemetry, verdict distribution, and confidence ratings across all audited claims.
                  </p>
                </div>

                {analytics && (
                  <>
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 font-mono text-xs sm:text-sm">
                      <div className="p-5 rounded-2xl surface-card">
                        <div className="text-slate-500 dark:text-slate-400">Total Audits</div>
                        <div className="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white mt-1">{analytics.total_verifications}</div>
                      </div>
                      <div className="p-5 rounded-2xl surface-card">
                        <div className="text-slate-500 dark:text-slate-400">Avg Confidence</div>
                        <div className="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white mt-1">{analytics.avg_confidence}%</div>
                      </div>
                      <div className="p-5 rounded-2xl surface-card">
                        <div className="text-slate-500 dark:text-slate-400">Avg Retr. Chunks</div>
                        <div className="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white mt-1">{analytics.avg_sources_retrieved}</div>
                      </div>
                      <div className="p-5 rounded-2xl surface-card">
                        <div className="text-slate-500 dark:text-slate-400">Total Chunks</div>
                        <div className="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white mt-1">{health?.indexed_chunks ?? 0}</div>
                      </div>
                    </div>

                    <div className="surface-card rounded-2xl p-8 flex flex-col items-center">
                      <h3 className="text-sm font-mono font-bold text-slate-800 dark:text-slate-200 uppercase tracking-wider mb-6">
                        Verdict Distribution
                      </h3>
                      <div className="w-72 h-72">
                        <canvas ref={chartRef}></canvas>
                      </div>
                    </div>
                  </>
                )}
              </div>
            )}

            {/* ======================================================== */}
            {/* TAB 5: SETTINGS & INFERENCE PROVIDER                     */}
            {/* ======================================================== */}
            {activeTab === 'settings' && (
              <div className="max-w-3xl w-full mx-auto space-y-6">
                <div>
                  <h2 className="text-2xl sm:text-3xl font-bold text-slate-900 dark:text-white font-sans">Engine Configuration & Settings</h2>
                  <p className="text-sm sm:text-base text-slate-600 dark:text-slate-400 mt-1">
                    Configure LLM reasoning provider, API keys, and retrieval parameters.
                  </p>
                </div>

                <div className="surface-card rounded-2xl p-6 sm:p-8 space-y-6">
                  <div>
                    <label className="block text-xs font-mono font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">
                      LLM Reasoning Provider
                    </label>
                    <select
                      value={selectedProvider}
                      onChange={(e) => setSelectedProvider(e.target.value)}
                      className="w-full bg-slate-50 dark:bg-slate-950 rounded-xl px-4 py-3.5 text-slate-900 dark:text-slate-100 border border-slate-300 dark:border-slate-800 focus:outline-none focus:border-slate-600 text-sm font-mono shadow-inner"
                    >
                      <option value="fallback">Local Embedded Reasoner (Default, Zero-Latency, Offline)</option>
                      <option value="openai">OpenAI (GPT-4o / GPT-4o-mini)</option>
                      <option value="gemini">Google Gemini 1.5 Flash</option>
                      <option value="groq">Groq (Llama 3 70B Fast)</option>
                      <option value="ollama">Local Ollama (DeepSeek / Llama 3)</option>
                    </select>
                  </div>

                  {selectedProvider !== 'fallback' && (
                    <div>
                      <label className="block text-xs font-mono font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">
                        API Key for {selectedProvider.toUpperCase()}
                      </label>
                      <input
                        type="password"
                        value={apiKeyInput}
                        onChange={(e) => setApiKeyInput(e.target.value)}
                        placeholder={`Enter your ${selectedProvider} API key...`}
                        className="w-full bg-slate-50 dark:bg-slate-950 rounded-xl px-4 py-3.5 text-slate-900 dark:text-slate-100 border border-slate-300 dark:border-slate-800 focus:outline-none focus:border-slate-600 text-sm font-mono shadow-inner"
                      />
                    </div>
                  )}

                  <div className="pt-4 border-t border-slate-200 dark:border-slate-800 flex justify-end">
                    <button
                      onClick={() => showToast('Settings saved successfully', 'success')}
                      className="px-6 py-2.5 rounded-xl bg-slate-900 text-white dark:bg-white dark:text-slate-900 hover:bg-slate-800 font-bold text-xs font-mono transition-all shadow-sm"
                    >
                      Save Settings
                    </button>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* Minimalist Footer */}
          <footer className="border-t border-slate-200 dark:border-slate-800/80 bg-white/60 dark:bg-slate-950/60 py-6 text-xs text-slate-500 font-mono mt-12">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-3">
              <div className="flex items-center gap-2">
                <span className="font-bold text-slate-800 dark:text-slate-200">TruthLens</span>
                <span>— Explainable AI Fact Verification Platform</span>
              </div>
              <div className="flex items-center gap-4 text-slate-500 dark:text-slate-400">
                <span>RAG 2.0</span>
                <span>•</span>
                <span>ChromaDB Vector Vault</span>
                <span>•</span>
                <span>Hybrid Semantic Reranker</span>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
