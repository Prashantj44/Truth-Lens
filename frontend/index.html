<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TruthLens — Explainable Fact Verification Terminal</title>
  
  <!-- Modern Editorial & Precision Sans Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Inter"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            dark: {
              950: '#060608',
              900: '#0c0c10',
              850: '#131318',
              800: '#1b1b22',
              750: '#262630',
              700: '#32323e',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18, ReactDOM & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      color-scheme: dark;
    }
    body {
      background-color: #060608;
      background-image: 
        radial-gradient(ellipse at 50% -10%, rgba(255, 255, 255, 0.06) 0%, transparent 60%),
        radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 100% 100%, 28px 28px;
      background-attachment: fixed;
    }
    .glass-card {
      background: rgba(12, 12, 16, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card:hover {
      border-color: rgba(255, 255, 255, 0.16);
    }
    .omnibox-card {
      background: rgba(14, 14, 20, 0.9);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
    }
    .omnibox-card:focus-within {
      border-color: rgba(255, 255, 255, 0.35);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 25px rgba(255, 255, 255, 0.05);
    }
    .ticker-move {
      display: inline-block;
      white-space: nowrap;
      animation: ticker 40s linear infinite;
    }
    @keyframes ticker {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-50%, 0, 0); }
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #060608; }
    ::-webkit-scrollbar-thumb { background: #262630; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #404050; }
  </style>
</head>
<body class="text-zinc-100 min-h-screen antialiased selection:bg-white selection:text-black font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Minimalist Precision Monochrome Icons ---
    const Icon = ({ name, className = "w-4 h-4" }) => {
      switch (name) {
        case 'shield':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>;
        case 'lens':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><circle cx="11" cy="11" r="8" strokeWidth="2" /><path strokeLinecap="round" strokeWidth="2" d="M21 21l-4.35-4.35M11 8a3 3 0 00-3 3" /></svg>;
        case 'database':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4" /></svg>;
        case 'history':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;
        case 'chart':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>;
        case 'settings':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>;
        case 'check':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 13l4 4L19 7" /></svg>;
        case 'x':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M6 18L18 6M6 6l12 12" /></svg>;
        case 'alert':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>;
        case 'help':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;
        case 'trash':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>;
        case 'upload':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>;
        case 'sparkles':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>;
        case 'refresh':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>;
        case 'link':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" /></svg>;
        case 'message':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>;
        case 'copy':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>;
        case 'arrow-right':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>;
        case 'zap':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>;
        case 'book':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>;
        case 'globe':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><circle cx="12" cy="12" r="10" strokeWidth="2" /><path strokeLinecap="round" strokeWidth="2" d="M21 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z" /></svg>;
        default:
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><circle cx="12" cy="12" r="10" strokeWidth="2" /></svg>;
      }
    };

    // --- Refined Minimalist Verdict Badges ---
    const VerdictBadge = ({ verdict, size = "md" }) => {
      const cfg = {
        'SUPPORTED': {
          label: 'VERIFIED TRUE',
          sub: 'Supported by indexed evidence',
          border: 'border-white/30',
          bg: 'bg-white/10 text-white',
          dot: 'bg-white',
          icon: 'check'
        },
        'REFUTED': {
          label: 'DEBUNKED / FALSE',
          sub: 'Directly contradicted by sources',
          border: 'border-zinc-500',
          bg: 'bg-zinc-800 text-zinc-100',
          dot: 'bg-zinc-400',
          icon: 'x'
        },
        'MISLEADING': {
          label: 'MISLEADING / MIXED',
          sub: 'Partially accurate or missing nuance',
          border: 'border-zinc-600',
          bg: 'bg-zinc-850 text-zinc-200',
          dot: 'bg-zinc-300',
          icon: 'alert'
        },
        'INSUFFICIENT EVIDENCE': {
          label: 'UNVERIFIED CLAIM',
          sub: 'Insufficient authoritative documentation',
          border: 'border-zinc-700',
          bg: 'bg-zinc-900 text-zinc-400',
          dot: 'bg-zinc-600',
          icon: 'help'
        }
      }[verdict] || {
        label: verdict || 'UNKNOWN',
        sub: 'Pending analysis',
        border: 'border-zinc-700',
        bg: 'bg-zinc-900 text-zinc-400',
        dot: 'bg-zinc-600',
        icon: 'help'
      };

      if (size === "lg") {
        return (
          <div className={`px-5 py-3 rounded-xl border ${cfg.border} ${cfg.bg} flex items-center gap-3.5 shadow-lg`}>
            <div className={`w-3 h-3 rounded-full ${cfg.dot} shrink-0 animate-pulse`}></div>
            <div>
              <div className="text-base font-bold tracking-tight font-mono">{cfg.label}</div>
              <div className="text-[11px] text-zinc-400 font-sans">{cfg.sub}</div>
            </div>
          </div>
        );
      }

      return (
        <span className={`inline-flex items-center gap-2 px-3 py-1 rounded-lg border ${cfg.border} ${cfg.bg} text-xs font-mono font-semibold`}>
          <span className={`w-1.5 h-1.5 rounded-full ${cfg.dot}`}></span>
          <span>{cfg.label}</span>
        </span>
      );
    };

    // --- Evidence Chunk Card with Clean Minimalist Styling ---
    const EvidenceChunkCard = ({ chunk }) => {
      const isSupport = chunk.stance === 'SUPPORT';
      const isContradict = chunk.stance === 'CONTRADICT';

      return (
        <div className="p-4 sm:p-5 rounded-xl bg-dark-900 border border-zinc-800/80 hover:border-zinc-700 transition-all space-y-3">
          <div className="flex items-center justify-between gap-2 text-xs font-mono">
            <span className={`px-2.5 py-0.5 rounded text-[11px] font-semibold border ${
              isSupport 
                ? 'bg-white text-black border-white' 
                : isContradict 
                ? 'bg-zinc-800 text-zinc-100 border-zinc-600' 
                : 'bg-zinc-900 text-zinc-400 border-zinc-800'
            }`}>
              {isSupport ? 'SUPPORTING EVIDENCE' : isContradict ? 'CONTRADICTING EVIDENCE' : 'NEUTRAL CONTEXT'}
            </span>
            <span className="text-zinc-500">
              Match: <strong className="text-zinc-300">{chunk.similarity_score}%</strong>
            </span>
          </div>

          <p className="text-sm sm:text-[15px] text-zinc-200 leading-relaxed font-sans">
            "{chunk.text}"
          </p>

          <div className="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-zinc-850 text-xs text-zinc-500 font-mono">
            <span className="truncate max-w-[260px] text-zinc-400 font-medium">
              📁 {chunk.document_name}
            </span>
            <span>Credibility: <strong className="text-zinc-300">{chunk.credibility_score}%</strong></span>
          </div>
        </div>
      );
    };

    // --- Main Application Component ---
    function App() {
      const [activeTab, setActiveTab] = useState('verify');
      const [inputMode, setInputMode] = useState('text'); // 'text', 'url', 'forward'
      
      const [claimInput, setClaimInput] = useState('');
      const [urlInput, setUrlInput] = useState('');
      const [forwardInput, setForwardInput] = useState('');
      
      const [selectedProvider, setSelectedProvider] = useState('fallback');
      const [apiKeyInput, setApiKeyInput] = useState('');
      
      const [verifying, setVerifying] = useState(false);
      const [progressStep, setProgressStep] = useState(0);
      const [extractingUrl, setExtractingUrl] = useState(false);
      const [cleaningForward, setCleaningForward] = useState(false);
      const [syncingNews, setSyncingNews] = useState(false);
      const [trainingDataset, setTrainingDataset] = useState(false);
      const [seeding, setSeeding] = useState(false);
      
      const [currentResult, setCurrentResult] = useState(null);
      const [trendingFilter, setTrendingFilter] = useState('ALL');
      const [trendingClaims, setTrendingClaims] = useState([]);
      const [health, setHealth] = useState(null);
      const [documents, setDocuments] = useState([]);
      const [history, setHistory] = useState([]);
      const [analytics, setAnalytics] = useState(null);
      const [newsStatus, setNewsStatus] = useState(null);
      const [toast, setToast] = useState(null);

      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      const showToast = (msg, type = 'info') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 4000);
      };

      useEffect(() => {
        loadHealth();
        loadDocuments();
        loadHistory();
        loadAnalytics();
        loadNewsStatus();
        loadTrendingClaims();
      }, []);

      const loadHealth = async () => {
        try {
          const res = await fetch('/api/health');
          const data = await res.json();
          setHealth(data);
        } catch (e) {
          console.error(e);
        }
      };

      const loadDocuments = async () => {
        try {
          const res = await fetch('/api/documents');
          const data = await res.json();
          setDocuments(data);
        } catch (e) {
          console.error(e);
        }
      };

      const loadHistory = async () => {
        try {
          const res = await fetch('/api/history?limit=50');
          const data = await res.json();
          setHistory(data);
        } catch (e) {
          console.error(e);
        }
      };

      const loadAnalytics = async () => {
        try {
          const res = await fetch('/api/analytics');
          const data = await res.json();
          setAnalytics(data);
        } catch (e) {
          console.error(e);
        }
      };

      const loadNewsStatus = async () => {
        try {
          const res = await fetch('/api/news/status');
          const data = await res.json();
          setNewsStatus(data);
        } catch (e) {
          console.error(e);
        }
      };

      const loadTrendingClaims = async () => {
        try {
          const res = await fetch('/api/news/trending');
          const data = await res.json();
          if (Array.isArray(data)) {
            setTrendingClaims(data);
          }
        } catch (e) {
          console.error(e);
        }
      };

      // Handle Core Claim Verification (Only triggered when user clicks "Verify Claim" or presses Ctrl+Enter)
      const handleVerify = async (claimToVerify) => {
        const text = (claimToVerify || claimInput).trim();
        if (!text) {
          showToast('Please enter a claim or statement to verify.', 'error');
          return;
        }

        setVerifying(true);
        setCurrentResult(null);
        setProgressStep(1);

        const stepTimer1 = setTimeout(() => setProgressStep(2), 300);
        const stepTimer2 = setTimeout(() => setProgressStep(3), 700);
        const stepTimer3 = setTimeout(() => setProgressStep(4), 1100);

        try {
          const res = await fetch('/api/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              claim: text,
              llm_provider: selectedProvider,
              api_key: apiKeyInput || null
            })
          });

          if (!res.ok) {
            const err = await res.json();
            throw new Error(err.detail || 'Verification failed');
          }

          const data = await res.json();
          setCurrentResult(data);
          loadHealth();
          loadHistory();
          loadAnalytics();
          showToast(`Audit Completed: ${data.verdict}`, 'success');
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          clearTimeout(stepTimer1);
          clearTimeout(stepTimer2);
          clearTimeout(stepTimer3);
          setVerifying(false);
          setProgressStep(0);
        }
      };

      // Handle URL Extraction (Loads headline into editor WITHOUT auto-verifying)
      const handleExtractUrl = async () => {
        const u = urlInput.trim();
        if (!u) {
          showToast('Please enter an online news article URL.', 'error');
          return;
        }
        setExtractingUrl(true);
        showToast('Scanning article URL & extracting headline...', 'info');
        try {
          const res = await fetch('/api/news/extract-url', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: u })
          });
          const data = await res.json();
          if (data.status === 'success' && data.extracted_claim) {
            setClaimInput(data.extracted_claim);
            setInputMode('text');
            setCurrentResult(null);
            showToast('Headline extracted! Click "Verify Claim" to audit.', 'success');
          } else {
            showToast(data.message || 'Could not extract a readable headline from this link.', 'error');
          }
        } catch (err) {
          showToast('URL extraction failed: ' + err.message, 'error');
        } finally {
          setExtractingUrl(false);
        }
      };

      // Handle WhatsApp Forward Cleaning (Loads cleaned claim into editor WITHOUT auto-verifying)
      const handleCleanForward = async () => {
        const text = forwardInput.trim();
        if (!text) {
          showToast('Please paste a WhatsApp forward or viral message.', 'error');
          return;
        }
        setCleaningForward(true);
        showToast('Cleaning forward headers & isolating claim...', 'info');
        try {
          const res = await fetch('/api/news/clean-forward', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text })
          });
          const data = await res.json();
          const clean = data.cleaned_claim || text;
          setClaimInput(clean);
          setInputMode('text');
          setCurrentResult(null);
          showToast('Assertion isolated! Click "Verify Claim" to audit.', 'success');
        } catch (err) {
          showToast('Forward cleaning failed: ' + err.message, 'error');
        } finally {
          setCleaningForward(false);
        }
      };

      // 1-Click Copy Fact-Check Report for WhatsApp / Social Media
      const handleCopyWhatsAppReport = (result) => {
        if (!result) return;
        const verdictEmoji = {
          'SUPPORTED': '✅ [VERIFIED TRUE]',
          'REFUTED': '❌ [DEBUNKED / FALSE]',
          'MISLEADING': '⚠️ [MISLEADING / HALF-TRUTH]',
          'INSUFFICIENT EVIDENCE': '❓ [UNVERIFIED / INSUFFICIENT EVIDENCE]'
        }[result.verdict] || '🛡️ [FACT-CHECK]';

        const sources = (result.retrieved_sources || []).map(s => s.source || s.document_name).join(', ') || 'TruthLens Evidence Vault';

        const text = 
`🛡️ *TRUTHLENS FACT-CHECK AUDIT*
━━━━━━━━━━━━━━━━━━━━
📌 *Claim:* "${result.claim}"
⚖️ *Verdict:* ${verdictEmoji}
📊 *Confidence:* ${result.confidence_score}%

💡 *Executive Rationale:*

                          <Icon name="check" className="w-3.5 h-3.5 text-white" />
                          Supporting Evidence ({currentResult.supporting_evidence?.length || 0})
                        </h3>

                        {currentResult.supporting_evidence?.length > 0 ? (
                          <div className="space-y-3">
                            {currentResult.supporting_evidence.map((chunk) => (
                              <EvidenceChunkCard key={chunk.chunk_id} chunk={chunk} />
                            ))}
                          </div>
                        ) : (
                          <div className="p-6 rounded-xl bg-dark-900 border border-zinc-850 text-center text-xs text-zinc-500 font-mono">
                            No direct corroborating evidence found.
                          </div>
                        )}
                      </div>

                      {/* Contradicting Evidence */}
                      <div className="space-y-3">
                        <h3 className="text-xs font-mono font-semibold text-zinc-300 uppercase tracking-wider flex items-center gap-2 px-1">
                          <Icon name="x" className="w-3.5 h-3.5 text-white" />
                          Contradicting Evidence ({currentResult.contradicting_evidence?.length || 0})
                        </h3>

                        {currentResult.contradicting_evidence?.length > 0 ? (
                          <div className="space-y-3">
                            {currentResult.contradicting_evidence.map((chunk) => (
                              <EvidenceChunkCard key={chunk.chunk_id} chunk={chunk} />
                            ))}
                          </div>
                        ) : (
                          <div className="p-6 rounded-xl bg-dark-900 border border-zinc-850 text-center text-xs text-zinc-500 font-mono">
                            No direct contradictory evidence found.
                          </div>
                        )}
                      </div>
                    </div>

                    {/* Contextual Excerpts */}
                    {currentResult.neutral_evidence?.length > 0 && (
                      <div className="space-y-3 pt-2">
                        <h3 className="text-xs font-mono font-semibold uppercase tracking-wider text-zinc-500 px-1">
                          Contextual Excerpts ({currentResult.neutral_evidence.length})
                        </h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                          {currentResult.neutral_evidence.map((chunk) => (
                            <EvidenceChunkCard key={chunk.chunk_id} chunk={chunk} />
                          ))}
                        </div>
                      </div>
                    )}

                    {/* Sources Citations Table */}
                    <div className="glass-card rounded-2xl p-5 sm:p-6">
                      <h3 className="text-xs font-mono font-semibold text-zinc-300 uppercase tracking-wider mb-4 flex items-center gap-2">
                        <Icon name="database" className="w-3.5 h-3.5 text-white" />
                        Authoritative Sources & Citations
                      </h3>

                      {currentResult.retrieved_sources?.length > 0 ? (
                        <div className="overflow-x-auto">
                          <table className="w-full text-left text-xs">
                            <thead className="border-b border-zinc-800 text-zinc-500 font-mono">
                              <tr>
                                <th className="pb-2.5 px-3">Source Name</th>
                                <th className="pb-2.5 px-3">Type</th>
                                <th className="pb-2.5 px-3">Scope</th>
                                <th className="pb-2.5 px-3 text-right">Credibility</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-zinc-850 text-zinc-300 font-mono">
                              {currentResult.retrieved_sources.map((src, i) => (
                                <tr key={i} className="hover:bg-zinc-850/40">
                                  <td className="py-2.5 px-3 font-medium text-white">{src.source || src.document_name}</td>
                                  <td className="py-2.5 px-3">
                                    <span className="px-2 py-0.5 rounded bg-zinc-900 border border-zinc-800 text-zinc-300">
                                      {src.source_type}
                                    </span>
                                  </td>
                                  <td className="py-2.5 px-3 text-zinc-500">
                                    {src.pages?.length > 0 ? `pp. ${src.pages.join(', ')}` : 'Full Doc'}
                                  </td>
                                  <td className="py-2.5 px-3 text-right font-semibold text-white">
                                    {src.credibility_score}%
                                  </td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      ) : (
                        <div className="text-xs text-zinc-600 font-mono text-center py-3">No sources retrieved.</div>
                      )}
                    </div>

                  </div>
                )}

                {/* ======================================================== */}
                {/* TODAY'S TRENDING NEWS & VIRAL CLAIMS RADAR               */}
                {/* ======================================================== */}
                <div className="max-w-5xl mx-auto space-y-4 pt-4">
                  <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                    <div>
                      <h2 className="text-lg sm:text-xl font-bold text-white">
                        Today's Trending News & Viral Rumors
                      </h2>
                      <p className="text-xs text-zinc-400 mt-0.5">
                        Live 24h feed of active news stories. Click to load into the verifier.
                      </p>
                    </div>

                    {/* Category Filter Pills */}
                    <div className="flex flex-wrap items-center gap-1 bg-dark-900 p-1 rounded-xl border border-zinc-800 text-xs font-mono">
                      {['ALL', 'POLITICS', 'ECONOMY', 'HEALTH', 'TECHNOLOGY', 'MYTH', 'LIVE NEWS'].map((cat) => (
                        <button
                          key={cat}
                          onClick={() => setTrendingFilter(cat)}
                          className={`px-2.5 py-1 rounded-lg font-medium transition-all ${
                            trendingFilter === cat
                              ? 'bg-zinc-800 text-white font-semibold'
                              : 'text-zinc-400 hover:text-white'
                          }`}
                        >
                          {cat}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Trending Claims Grid */}
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                    {trendingClaims
                      .filter(item => trendingFilter === 'ALL' || item.badge === trendingFilter || item.category?.includes(trendingFilter))
                      .slice(0, 9)
                      .map((item, idx) => (
                        <div
                          key={idx}
                          className="glass-card rounded-xl p-4 flex flex-col justify-between hover:border-zinc-600 transition-all space-y-3"
                        >
                          <div className="space-y-2">
                            <div className="flex items-center justify-between gap-2 text-xs font-mono">
                              <span className="px-2 py-0.5 rounded bg-zinc-900 border border-zinc-800 text-zinc-300 font-semibold text-[10px]">
                                {item.badge || item.category}
                              </span>
                              <span className="text-zinc-500 text-[11px] truncate max-w-[120px]">
                                {item.viral_level || 'Viral Story'}
                              </span>
                            </div>

                            <p className="text-sm font-medium text-zinc-200 leading-snug">
                              "{item.claim}"
                            </p>

                            {item.source_hint && (
                              <div className="text-[11px] text-zinc-500 font-mono truncate">
                                Reference: <strong className="text-zinc-400">{item.source_hint}</strong>
                              </div>
                            )}
                          </div>

                          <div className="pt-2 border-t border-zinc-850 flex justify-end">
                            <button
                              onClick={() => {
                                setClaimInput(item.claim);
                                setInputMode('text');
                                setCurrentResult(null);
                                window.scrollTo({ top: 180, behavior: 'smooth' });
                                showToast('Loaded story into editor. Click "Verify Claim" to audit.', 'info');
                                const el = document.getElementById('claim-editor');
                                if (el) el.focus();
                              }}
                              className="px-3 py-1 rounded-lg bg-zinc-850 hover:bg-white text-zinc-300 hover:text-black border border-zinc-750 hover:border-white text-xs font-semibold flex items-center gap-1.5 transition-all"
                            >
                              <Icon name="arrow-right" className="w-3 h-3" />
                              <span>Load into Editor</span>
                            </button>
                          </div>
                        </div>
                      ))}
                  </div>
                </div>

              </div>
            )}

            {/* ======================================================== */}
            {/* TAB 2: KNOWLEDGE VAULT & LIVE NEWS ENGINE                */}
            {/* ======================================================== */}
            {activeTab === 'knowledge' && (
              <div className="max-w-5xl mx-auto space-y-6">
                {/* Header & Main Controls */}
                <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                  <div>
                    <h2 className="text-2xl font-bold text-white">Knowledge Vault & News Engine</h2>
                    <p className="text-sm text-zinc-400 mt-1">
                      Continuous real-time news retrieval, historical dataset training, and vector indexing.
                    </p>
                  </div>
                  
                  {/* Action Controls */}
                  <div className="flex flex-wrap items-center gap-2 font-mono text-xs">
                    <button
                      onClick={handleSyncNews}
                      disabled={syncingNews}
                      className="px-3.5 py-2 rounded-xl bg-white text-black hover:bg-zinc-200 font-semibold flex items-center gap-2 shadow-sm transition-all disabled:opacity-50"
                      title="Pull latest 24-hour news from Reuters, AP, BBC, and PolitiFact"
                    >
                      <Icon name="zap" className={`w-3.5 h-3.5 ${syncingNews ? 'animate-spin' : ''}`} />
                      <span>{syncingNews ? 'Syncing...' : 'Sync Latest News'}</span>
                    </button>

                    <button
                      onClick={handleTrainDataset}
                      disabled={trainingDataset}
                      className="px-3.5 py-2 rounded-xl bg-zinc-850 hover:bg-zinc-800 text-zinc-200 hover:text-white border border-zinc-750 font-semibold flex items-center gap-2 transition-all disabled:opacity-50"
                      title="Train/index historical news from ISOT Reuters and PolitiFact datasets"
                    >
                      <Icon name="book" className={`w-3.5 h-3.5 ${trainingDataset ? 'animate-pulse' : ''}`} />
                      <span>{trainingDataset ? 'Training...' : 'Train on News Dataset'}</span>
                    </button>

                    <button
                      onClick={handleSeed}
                      disabled={seeding}
                      className="px-3.5 py-2 rounded-xl bg-zinc-900 hover:bg-zinc-855 text-zinc-400 hover:text-white border border-zinc-800 font-semibold flex items-center gap-2 transition-all disabled:opacity-50"
                    >
                      <Icon name="sparkles" className="w-3.5 h-3.5" />
                      <span>{seeding ? 'Seeding...' : 'Load Curated Dossiers'}</span>
                    </button>
                  </div>
                </div>

                {/* 1. Automated Daily Live News Engine Card */}
                <div className="glass-card rounded-2xl p-5 sm:p-6 space-y-4">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-zinc-800">
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
                        <h3 className="text-base font-semibold text-white">
                          Automated Daily News Stream & Ingestion Engine
                        </h3>
                      </div>
                      <p className="text-xs text-zinc-400 mt-0.5">
                        Monitors trusted global newsrooms & fact-checkers. Runs every 24 hours in the background.
                      </p>
                    </div>

                    <span className="inline-flex items-center gap-2 px-3 py-1 rounded-lg bg-dark-950 border border-zinc-800 text-xs font-mono text-zinc-300">
                      <span>24h Scheduler: Active</span>
                    </span>
                  </div>

                  {/* Engine Stats Grid */}
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 font-mono text-xs">
                    <div className="p-3.5 rounded-xl bg-dark-950 border border-zinc-850">
                      <div className="text-zinc-500">Live Articles</div>
                      <div className="text-xl font-bold text-white mt-1">
                        {newsStatus?.total_live_articles || 0}
                      </div>
                    </div>

                    <div className="p-3.5 rounded-xl bg-dark-950 border border-zinc-850">
                      <div className="text-zinc-500">News Chunks</div>
                      <div className="text-xl font-bold text-white mt-1">
                        {newsStatus?.total_news_chunks || 0}
                      </div>
                    </div>

                    <div className="p-3.5 rounded-xl bg-dark-950 border border-zinc-850">
                      <div className="text-zinc-500">Active RSS Feeds</div>
                      <div className="text-xl font-bold text-white mt-1">
                        {newsStatus?.active_sources?.length || 4}
                      </div>
                    </div>

                    <div className="p-3.5 rounded-xl bg-dark-950 border border-zinc-850">
                      <div className="text-zinc-500">Last Synced</div>
                      <div className="text-xs font-semibold text-zinc-300 mt-1 truncate">
                        {newsStatus?.last_sync || 'Recently'}
                      </div>
                    </div>
                  </div>
                </div>

                {/* 2. Upload Document Card */}
                <div className="glass-card rounded-2xl p-5 sm:p-6 space-y-4">
                  <div className="flex items-center justify-between">
                    <div>
                      <h3 className="text-base font-semibold text-white">Upload New Reference Dossier</h3>
                      <p className="text-xs text-zinc-400 mt-0.5">Index PDF, TXT, or Markdown documents into the vector vault.</p>
                    </div>
                  </div>

                  <label className="border-2 border-dashed border-zinc-800 hover:border-zinc-600 rounded-xl p-6 text-center cursor-pointer transition-all flex flex-col items-center justify-center gap-2 bg-dark-950/50">
                    <Icon name="upload" className="w-6 h-6 text-zinc-400" />
                    <span className="text-sm font-medium text-zinc-200">Click to upload document or drag and drop</span>
                    <span className="text-xs text-zinc-500 font-mono">PDF, TXT, MD (Max 10MB)</span>
                    <input type="file" accept=".pdf,.txt,.md" className="hidden" onChange={handleFileUpload} />
                  </label>
                </div>

                {/* 3. Indexed Documents Table */}
                <div className="glass-card rounded-2xl p-5 sm:p-6 space-y-4">
                  <h3 className="text-base font-semibold text-white flex items-center justify-between">
                    <span>Indexed Knowledge Vault Documents ({documents.length})</span>
                    <span className="text-xs font-mono text-zinc-400">{health?.indexed_chunks ?? 0} total chunks</span>
                  </h3>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead className="border-b border-zinc-800 text-zinc-500 font-mono">
                        <tr>
                          <th className="pb-2.5 px-3">Document Title</th>
                          <th className="pb-2.5 px-3">Category / Type</th>
                          <th className="pb-2.5 px-3">Chunks</th>
                          <th className="pb-2.5 px-3">Indexed On</th>
                          <th className="pb-2.5 px-3 text-right">Actions</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-zinc-850 text-zinc-300 font-mono">
                        {documents.map((doc) => (
                          <tr key={doc.id} className="hover:bg-zinc-850/40">
                            <td className="py-2.5 px-3 font-medium text-white">{doc.title}</td>
                            <td className="py-2.5 px-3">
                              <span className="px-2 py-0.5 rounded bg-zinc-900 border border-zinc-800 text-zinc-300">
                                {doc.source_type}
                              </span>
                            </td>
                            <td className="py-2.5 px-3">{doc.chunks_count}</td>
                            <td className="py-2.5 px-3 text-zinc-500">{doc.created_at?.slice(0, 10)}</td>
                            <td className="py-2.5 px-3 text-right">
                              <button
                                onClick={() => handleDeleteDoc(doc.id, doc.title)}
                                className="p-1.5 rounded-lg hover:bg-zinc-800 text-zinc-500 hover:text-zinc-200 transition-colors"
                                title="Delete document"
                              >
                                <Icon name="trash" className="w-3.5 h-3.5" />
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

              </div>
            )}

            {/* ======================================================== */}
            {/* TAB 3: AUDIT HISTORY                                     */}
            {/* ======================================================== */}
            {activeTab === 'history' && (
              <div className="max-w-5xl mx-auto space-y-6">
                <div>
                  <h2 className="text-2xl font-bold text-white">Fact-Checking Audit History</h2>
                  <p className="text-sm text-zinc-400 mt-1">
                    Complete audit trail of all verified claims, confidence ratings, and evidence matches.
                  </p>
                </div>

                <div className="glass-card rounded-2xl p-5 sm:p-6">
                  {history.length > 0 ? (
                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-xs">
                        <thead className="border-b border-zinc-800 text-zinc-500 font-mono">
                          <tr>
                            <th className="pb-2.5 px-3">Claim Statement</th>
                            <th className="pb-2.5 px-3">Verdict</th>
                            <th className="pb-2.5 px-3">Confidence</th>
                            <th className="pb-2.5 px-3">Provider</th>
                            <th className="pb-2.5 px-3">Timestamp</th>
                            <th className="pb-2.5 px-3 text-right">Action</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-zinc-850 text-zinc-300 font-mono">
                          {history.map((h) => (
                            <tr key={h.id} className="hover:bg-zinc-850/40">
                              <td className="py-3 px-3 font-sans font-medium text-white max-w-xs truncate">
                                "{h.claim}"
                              </td>
                              <td className="py-3 px-3">
                                <VerdictBadge verdict={h.verdict} size="sm" />
                              </td>
                              <td className="py-3 px-3 font-semibold text-white">{h.confidence_score}%</td>
                              <td className="py-3 px-3 text-zinc-400">{h.llm_provider}</td>
                              <td className="py-3 px-3 text-zinc-500">{h.created_at?.slice(0, 16)}</td>
                              <td className="py-3 px-3 text-right">
                                <button
                                  onClick={() => {
                                    setClaimInput(h.claim);
                                    setActiveTab('verify');
                                    setCurrentResult(null);
                                    showToast('Loaded audit into editor. Click "Verify Claim" to audit.', 'info');
                                    const el = document.getElementById('claim-editor');
                                    if (el) el.focus();
                                  }}
                                  className="px-2.5 py-1 rounded-lg bg-zinc-850 hover:bg-white text-zinc-300 hover:text-black text-xs font-semibold transition-all"
                                >
                                  Load
                                </button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  ) : (
                    <div className="text-center py-10 text-zinc-500 font-mono text-sm">
                      No audit history records found yet. Run your first claim verification above!
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* ======================================================== */}
            {/* TAB 4: ANALYTICS & METRICS                               */}
            {/* ======================================================== */}
            {activeTab === 'analytics' && (
              <div className="max-w-5xl mx-auto space-y-6">
                <div>
                  <h2 className="text-2xl font-bold text-white">Verification Engine Analytics</h2>
                  <p className="text-sm text-zinc-400 mt-1">
                    Telemetry, verdict distribution, and confidence ratings across all audited claims.
                  </p>
                </div>

                {analytics && (
                  <>
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 font-mono text-xs">
                      <div className="p-4 rounded-xl glass-card">
                        <div className="text-zinc-500">Total Audits</div>
                        <div className="text-2xl font-bold text-white mt-1">{analytics.total_verifications}</div>
                      </div>
                      <div className="p-4 rounded-xl glass-card">
                        <div className="text-zinc-500">Avg Confidence</div>
                        <div className="text-2xl font-bold text-white mt-1">{analytics.avg_confidence}%</div>
                      </div>
                      <div className="p-4 rounded-xl glass-card">
                        <div className="text-zinc-500">Avg Retr. Chunks</div>
                        <div className="text-2xl font-bold text-white mt-1">{analytics.avg_sources_retrieved}</div>
                      </div>
                      <div className="p-4 rounded-xl glass-card">
                        <div className="text-zinc-500">Total Chunks</div>
                        <div className="text-2xl font-bold text-white mt-1">{health?.indexed_chunks ?? 0}</div>
                      </div>
                    </div>

                    <div className="glass-card rounded-2xl p-6 flex flex-col items-center">
                      <h3 className="text-sm font-mono font-semibold text-zinc-300 uppercase tracking-wider mb-4">
                        Verdict Distribution
                      </h3>
                      <div className="w-64 h-64">
                        <canvas ref={chartRef}></canvas>
                      </div>
                    </div>
                  </>
                )}
              </div>
            )}

            {/* ======================================================== */}
            {/* TAB 5: SETTINGS & INFERENCE PROVIDER                     */}
            {/* ======================================================== */}
            {activeTab === 'settings' && (
              <div className="max-w-3xl mx-auto space-y-6">
                <div>
                  <h2 className="text-2xl font-bold text-white">Engine Configuration & Settings</h2>
                  <p className="text-sm text-zinc-400 mt-1">
                    Configure LLM reasoning provider, API keys, and retrieval parameters.
                  </p>
                </div>

                <div className="glass-card rounded-2xl p-6 space-y-6">
                  <div>
                    <label className="block text-xs font-mono font-semibold text-zinc-300 uppercase tracking-wider mb-2">
                      LLM Reasoning Provider
                    </label>
                    <select
                      value={selectedProvider}
                      onChange={(e) => setSelectedProvider(e.target.value)}
                      className="w-full bg-dark-950 rounded-xl px-4 py-3 text-zinc-100 border border-zinc-800 focus:outline-none focus:border-zinc-500 text-sm font-mono"
                    >
                      <option value="fallback">Local Embedded Reasoner (Default, Zero-Latency, Offline)</option>
                      <option value="openai">OpenAI (GPT-4o / GPT-4o-mini)</option>
                      <option value="gemini">Google Gemini 1.5 Flash</option>
                      <option value="groq">Groq (Llama 3 70B Fast)</option>
                      <option value="ollama">Local Ollama (DeepSeek / Llama 3)</option>
                    </select>
                  </div>

                  {selectedProvider !== 'fallback' && (
                    <div>
                      <label className="block text-xs font-mono font-semibold text-zinc-300 uppercase tracking-wider mb-2">
                        API Key for {selectedProvider.toUpperCase()}
                      </label>
                      <input
                        type="password"
                        value={apiKeyInput}
                        onChange={(e) => setApiKeyInput(e.target.value)}
                        placeholder={`Enter your ${selectedProvider} API key...`}
                        className="w-full bg-dark-950 rounded-xl px-4 py-3 text-zinc-100 border border-zinc-800 focus:outline-none focus:border-zinc-500 text-sm font-mono"
                      />
                    </div>
                  )}

                  <div className="pt-4 border-t border-zinc-850 flex justify-end">
                    <button
                      onClick={() => showToast('Settings saved successfully', 'success')}
                      className="px-5 py-2.5 rounded-xl bg-white text-black hover:bg-zinc-200 font-semibold text-xs font-mono transition-all"
                    >
                      Save Settings
                    </button>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* Minimalist Footer */}
          <footer className="border-t border-zinc-850/80 bg-dark-950/60 py-6 text-xs text-zinc-500 font-mono mt-12">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-3">
              <div className="flex items-center gap-2">
                <span className="font-semibold text-zinc-300">TruthLens</span>
                <span>— Explainable AI Fact Verification Platform</span>
              </div>
              <div className="flex items-center gap-4 text-zinc-500">
                <span>RAG 2.0</span>
                <span>•</span>
                <span>ChromaDB Vector Vault</span>
                <span>•</span>
                <span>Hybrid Reranker</span>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
