<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TruthLens — Explainable AI Fact Verification Engine</title>
  
  <!-- Modern Editorial & Forensic Display Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            display: ['"Syne"', '"Space Grotesk"', 'sans-serif'],
            heading: ['"Space Grotesk"', 'sans-serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            obsidian: '#020203',
            surface: '#08080a',
            card: '#0e0e12',
            border: '#1c1c22',
            subtle: '#2a2a32',
            muted: '#71717a',
            light: '#f4f4f5',
          }
        }
      }
    }
  </script>

  <!-- React 18, ReactDOM & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      color-scheme: dark;
    }
    body {
      background-color: #020203;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.07) 0%, transparent 55%),
        radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 100% 100%, 32px 32px;
      background-attachment: fixed;
    }
    .hud-card {
      background: rgba(14, 14, 18, 0.85);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.09);
    }
    .hud-card:hover {
      border-color: rgba(255, 255, 255, 0.22);
    }
    .hud-input-card {
      background: rgba(8, 8, 10, 0.95);
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .hud-input-card:focus-within {
      border-color: rgba(255, 255, 255, 0.5);
      box-shadow: 0 0 35px rgba(255, 255, 255, 0.06);
    }
    .hero-glow-title {
      background: linear-gradient(180deg, #FFFFFF 0%, #E4E4E7 50%, #71717A 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .ticker-wrap {
      overflow: hidden;
      white-space: nowrap;
    }
    .ticker-move {
      display: inline-block;
      animation: ticker 35s linear infinite;
    }
    @keyframes ticker {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-50%, 0, 0); }
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #020203; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #52525b; }
  </style>
</head>
<body class="text-zinc-100 min-h-screen antialiased selection:bg-white selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- High-Precision Minimalist Monochrome Icons ---
    const Icon = ({ name, className = "w-4 h-4" }) => {
      switch (name) {
        case 'shield':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>;
        case 'database':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4" /></svg>;

          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;
        case 'chart':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>;
        case 'settings':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>;
        case 'check':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 13l4 4L19 7" /></svg>;
        case 'x':

        case 'alert':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>;
        case 'help':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;
        case 'trash':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>;
        case 'upload':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>;
        case 'sparkles':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>;
        case 'refresh':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>;
        case 'rss':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 5c7.18 0 13 5.82 13 13M6 11a7 7 0 017 7m-6 0a1 1 0 11-2 0 1 1 0 012 0z" /></svg>;
        case 'globe':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" /></svg>;
        case 'book':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>;
        case 'chevron-down':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" /></svg>;
        case 'chevron-up':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 15l7-7 7 7" /></svg>;
        case 'arrow-right':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>;
        case 'zap':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>;
        case 'link':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" /></svg>;
        case 'message':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>;
        case 'copy':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" /></svg>;
        case 'share':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" /></svg>;
        case 'fire':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z" /></svg>;
        default:
          return null;
      }
    };

    // --- State-of-the-Art Verdict Badge Component ---
    function VerdictBadge({ verdict, size = 'md' }) {
      const v = (verdict || 'INSUFFICIENT EVIDENCE').toUpperCase();
      const configs = {
        'SUPPORTED': {
          bg: 'bg-white text-black font-extrabold shadow-[0_0_30px_rgba(255,255,255,0.3)]',
          badgeClass: 'bg-white text-black border-white',
          iconName: 'check',
          label: 'SUPPORTED',
          desc: 'Corroborated by verified factual documentation in the knowledge vault.'
        },
        'REFUTED': {
          bg: 'bg-black text-white border-2 border-zinc-400 shadow-2xl',
          badgeClass: 'bg-black text-white border-zinc-400',
          iconName: 'x',
          label: 'REFUTED',
          desc: 'Directly contradicted by factual data in authoritative records.'
        },
        'MISLEADING': {
          bg: 'bg-zinc-900 text-zinc-100 border border-zinc-500 shadow-2xl',
          badgeClass: 'bg-zinc-900 text-zinc-200 border-zinc-600',
          iconName: 'alert',
          label: 'MISLEADING',
          desc: 'Partially accurate, but omits essential context, caveats, or nuance.'
        },
        'INSUFFICIENT EVIDENCE': {
          bg: 'bg-zinc-950 text-zinc-400 border border-dashed border-zinc-700 shadow-xl',
          badgeClass: 'bg-zinc-950 text-zinc-400 border-zinc-800 border-dashed',
          iconName: 'help',
          label: 'INSUFFICIENT EVIDENCE',
          desc: 'Knowledge vault lacks decisive records to corroborate or disprove.'
        }
      };

      const cfg = configs[v] || configs['INSUFFICIENT EVIDENCE'];

      if (size === 'lg') {
        return (
          <div className={`flex items-center gap-5 px-6 py-5 rounded-2xl ${cfg.bg} transition-all`}>
            <div className="w-12 h-12 rounded-xl bg-zinc-950 border border-zinc-700 flex items-center justify-center shrink-0">
              <Icon name={cfg.iconName} className="w-6 h-6 text-white" />
            </div>
            <div>
              <div className="text-2xl sm:text-3xl font-black tracking-wider uppercase font-display">
                {cfg.label}
              </div>
              <div className="text-xs opacity-80 font-medium mt-1 font-sans">{cfg.desc}</div>
            </div>
          </div>
        );
      }

      return (
        <span className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-lg border text-xs font-bold tracking-wider font-mono ${cfg.badgeClass}`}>
          <Icon name={cfg.iconName} className="w-3.5 h-3.5" />
          {cfg.label}
        </span>
      );
    }

    // --- Forensic Evidence Chunk Card Component ---
    function EvidenceChunkCard({ chunk }) {
      const [expanded, setExpanded] = useState(false);
      const stance = chunk.stance || 'NEUTRAL';
      const text = chunk.text || '';
      const isLong = text.length > 260;

      const styles = {
        'SUPPORTING': {
          border: 'border-white/40 hover:border-white',
          tag: 'bg-white text-black font-bold',
          icon: 'check',
          label: 'SUPPORTING EVIDENCE'
        },
        'CONTRADICTING': {
          border: 'border-zinc-600 hover:border-zinc-300',
          tag: 'bg-black text-white border border-zinc-500 font-bold',
          icon: 'x',
          label: 'CONTRADICTING EVIDENCE'
        },
        'NEUTRAL': {
          border: 'border-zinc-850 hover:border-zinc-700',
          tag: 'bg-zinc-900 text-zinc-400 border border-zinc-800',
          icon: 'help',
          label: 'CONTEXTUAL RECORD'
        }
      };

      const s = styles[stance] || styles['NEUTRAL'];

      return (
        <div className={`p-5 rounded-2xl hud-card border ${s.border} transition-all duration-200`}>
          <div className="flex items-center justify-between gap-2 pb-3 mb-3 border-b border-zinc-850">
            <span className={`inline-flex items-center gap-1.5 px-3 py-1 rounded text-xs font-mono tracking-wider ${s.tag}`}>
              <Icon name={s.icon} className="w-3.5 h-3.5" />
              {s.label}
            </span>
            <div className="flex items-center gap-2 text-xs font-mono">
              <span className="text-white font-bold">{chunk.relevance_score}% Match</span>
              <span className="text-zinc-700">|</span>
              <span className="px-2.5 py-0.5 rounded bg-zinc-900 border border-zinc-800 text-zinc-300 text-[11px]">
                {chunk.source_type}
              </span>
            </div>
          </div>

          <p className="text-sm sm:text-base text-zinc-200 leading-relaxed font-sans">
            {expanded || !isLong ? text : `${text.slice(0, 260)}...`}
          </p>

          {isLong && (
            <button 
              onClick={() => setExpanded(!expanded)}
              className="mt-2 text-xs text-white hover:text-zinc-300 font-medium inline-flex items-center gap-1 underline underline-offset-4 font-mono"
            >
              {expanded ? <>Show less <Icon name="chevron-up" className="w-3 h-3" /></> : <>Read complete chunk <Icon name="chevron-down" className="w-3 h-3" /></>}
            </button>
          )}

          <div className="mt-4 pt-3 border-t border-zinc-900 flex items-center justify-between text-xs text-zinc-500 font-mono">
            <span className="truncate max-w-[80%] text-zinc-400">
              Source: <strong className="text-zinc-200">{chunk.source}</strong> {chunk.page_number && `(p. ${chunk.page_number})`}
            </span>
            <span className="text-zinc-600 uppercase">ID: {chunk.chunk_id?.slice(-6)}</span>
          </div>
        </div>
      );
    }

    // --- Main Application Component ---
    function App() {
      const [activeTab, setActiveTab] = useState('verify');
      const [claimInput, setClaimInput] = useState('');
      const [inputMode, setInputMode] = useState('text'); // 'text' | 'url' | 'forward'
      const [urlInput, setUrlInput] = useState('');
      const [forwardInput, setForwardInput] = useState('');
      const [verifying, setVerifying] = useState(false);
      const [progressStep, setProgressStep] = useState(0);
      const [currentResult, setCurrentResult] = useState(null);
      const [documents, setDocuments] = useState([]);
      const [history, setHistory] = useState([]);
      const [analytics, setAnalytics] = useState(null);
      const [newsStatus, setNewsStatus] = useState(null);
      const [syncingNews, setSyncingNews] = useState(false);
      const [trainingDataset, setTrainingDataset] = useState(false);
      const [extractingUrl, setExtractingUrl] = useState(false);
      const [cleaningForward, setCleaningForward] = useState(false);
      const [trendingClaims, setTrendingClaims] = useState([]);
      const [trendingFilter, setTrendingFilter] = useState('ALL');
      const [health, setHealth] = useState({ indexed_chunks: 0 });
      const [seeding, setSeeding] = useState(false);
      const [historyModalItem, setHistoryModalItem] = useState(null);
      const [selectedProvider, setSelectedProvider] = useState('auto');
      const [apiKeyInput, setApiKeyInput] = useState(localStorage.getItem('truthlens_api_key') || '');
      const [historyFilter, setHistoryFilter] = useState('ALL');
      const [toast, setToast] = useState(null);
      
      const chartRef1 = useRef(null);
      const chartInstance1 = useRef(null);

      const showToast = (msg, type = 'info') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 4000);
      };

      // Load initial state
      useEffect(() => {
        loadHealth();
        loadDocuments();
        loadHistory();
        loadAnalytics();
        loadNewsStatus();
        loadTrendingClaims();

        // Auto-refresh news status periodically
        const newsInterval = setInterval(() => {
          loadNewsStatus();
        }, 30000);
        return () => clearInterval(newsInterval);
      }, []);

      const loadHealth = async () => {
        try {
          const res = await fetch('/health');
          const data = await res.json();
          setHealth(data);
        } catch (e) {
          console.error(e);
        }
      };

      const loadDocuments = async () => {
        try {
          const res = await fetch('/api/documents');
          const data = await res.json();
          setDocuments(data);
        } catch (e) {
          console.error(e);
        }
      };

      const loadHistory = async () => {
        try {
          const res = await fetch('/api/history?limit=50');
          const data = await res.json();
          setHistory(data);
        } catch (e) {
          console.error(e);
        }
      };

      const loadAnalytics = async () => {
        try {
          const res = await fetch('/api/analytics');
          const data = await res.json();
          setAnalytics(data);
        } catch (e) {
          console.error(e);
        }
      };

      const loadNewsStatus = async () => {
        try {
          const res = await fetch('/api/news/status');
          const data = await res.json();
          setNewsStatus(data);
        } catch (e) {
          console.error(e);
        }
      };

      const loadTrendingClaims = async () => {
        try {
          const res = await fetch('/api/news/trending');
          const data = await res.json();
          if (Array.isArray(data)) {
            setTrendingClaims(data);
          }
        } catch (e) {
          console.error(e);
        }
      };

      // Handle Core Claim Verification
      const handleVerify = async (claimToVerify) => {
        const text = (claimToVerify || claimInput).trim();
        if (!text) {
          showToast('Please enter a claim or statement to verify.', 'error');
          return;
        }

        setVerifying(true);
        setCurrentResult(null);
        setProgressStep(1);

        const stepTimer1 = setTimeout(() => setProgressStep(2), 350);
        const stepTimer2 = setTimeout(() => setProgressStep(3), 850);
        const stepTimer3 = setTimeout(() => setProgressStep(4), 1350);

        try {
          const res = await fetch('/api/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },

                          <tr>
                            <th className="pb-3 px-3">Filename / Source</th>
                            <th className="pb-3 px-3">Authority</th>
                            <th className="pb-3 px-3">Format</th>
                            <th className="pb-3 px-3">Chunks</th>
                            <th className="pb-3 px-3">Date</th>
                            <th className="pb-3 px-3 text-right">Action</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-zinc-900 text-zinc-300">
                          {documents.map((doc) => (
                            <tr key={doc.id} className="hover:bg-zinc-900/40">
                              <td className="py-3.5 px-3 font-medium text-white">{doc.filename}</td>
                              <td className="py-3.5 px-3">
                                <span className="px-2.5 py-0.5 rounded bg-zinc-900 border border-zinc-800 text-zinc-300">
                                  {doc.source_type}
                                </span>
                              </td>
                              <td className="py-3.5 px-3 text-zinc-500">{doc.file_type}</td>
                              <td className="py-3.5 px-3 font-bold text-white">{doc.number_of_chunks}</td>
                              <td className="py-3.5 px-3 text-zinc-500">{doc.upload_date}</td>
                              <td className="py-3.5 px-3 text-right">
                                <button
                                  onClick={() => handleDeleteDoc(doc.id, doc.filename)}
                                  className="p-2 rounded-lg text-zinc-500 hover:text-white hover:bg-zinc-900 transition-colors"
                                  title="Delete Document & Chunks"
                                >
                                  <Icon name="trash" className="w-4 h-4" />
                                </button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  ) : (
                    <div className="text-center py-10 text-sm text-zinc-600 font-mono">
                      No documents indexed. Click "Load Curated Dossiers" or "Sync Latest News" above to initialize.
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* ======================================================== */}
            {/* TAB 3: VERIFICATION HISTORY                              */}
            {/* ======================================================== */}
            {activeTab === 'history' && (
              <div className="max-w-6xl mx-auto space-y-6">
                <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                  <div>
                    <h2 className="text-3xl font-bold text-white font-display">Audit History</h2>
                    <p className="text-base text-zinc-400 mt-1 font-sans">
                      Chronological ledger of fact verification queries and generated reports.
                    </p>
                  </div>

                  {/* Filter by Verdict */}
                  <div className="flex items-center gap-1.5 bg-zinc-950 p-1.5 rounded-xl border border-zinc-800 text-xs sm:text-sm font-mono">
                    {['ALL', 'SUPPORTED', 'REFUTED', 'MISLEADING', 'INSUFFICIENT EVIDENCE'].map((f) => (
                      <button
                        key={f}
                        onClick={() => setHistoryFilter(f)}
                        className={`px-3.5 py-1.5 rounded-lg font-medium transition-all ${
                          historyFilter === f ? 'bg-white text-black font-bold' : 'text-zinc-400 hover:text-white'
                        }`}
                      >
                        {f === 'INSUFFICIENT EVIDENCE' ? 'INSUFFICIENT' : f}
                      </button>
                    ))}
                  </div>
                </div>

                {/* History Table */}
                <div className="hud-card rounded-2xl p-6 sm:p-8">
                  {history.length > 0 ? (
                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-xs sm:text-sm">
                        <thead className="border-b border-zinc-800 text-zinc-500 font-mono">
                          <tr>
                            <th className="pb-3 px-3">Claim Statement</th>
                            <th className="pb-3 px-3">Verdict</th>
                            <th className="pb-3 px-3">Confidence</th>
                            <th className="pb-3 px-3">Timestamp</th>
                            <th className="pb-3 px-3 text-right">Report</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-zinc-900 text-zinc-300 font-mono">
                          {history
                            .filter(h => historyFilter === 'ALL' || h.verdict === historyFilter)
                            .map((item) => (
                              <tr key={item.id} className="hover:bg-zinc-900/40">
                                <td className="py-3.5 px-3 font-medium text-white max-w-lg truncate font-sans">"{item.claim}"</td>
                                <td className="py-3.5 px-3">
                                  <VerdictBadge verdict={item.verdict} size="sm" />
                                </td>
                                <td className="py-3.5 px-3 font-bold text-white">{item.confidence_score}%</td>
                                <td className="py-3.5 px-3 text-zinc-500">{item.timestamp}</td>
                                <td className="py-3.5 px-3 text-right">
                                  <button
                                    onClick={() => setHistoryModalItem(item)}
                                    className="px-3.5 py-1.5 rounded-lg bg-zinc-900 hover:bg-zinc-800 text-zinc-200 hover:text-white border border-zinc-800 font-medium transition-colors"
                                  >
                                    Inspect
                                  </button>
                                </td>
                              </tr>
                            ))}
                        </tbody>
                      </table>
                    </div>
                  ) : (
                    <div className="text-center py-10 text-sm text-zinc-600 font-mono">
                      No verification logs recorded yet.
                    </div>
                  )}
                </div>

                {/* Record Inspection Modal */}
                {historyModalItem && (
                  <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
                    <div className="hud-card rounded-2xl max-w-3xl w-full max-h-[85vh] overflow-y-auto p-6 sm:p-10 space-y-6 border-zinc-700 shadow-2xl relative">
                      <div className="flex items-start justify-between gap-4 pb-4 border-b border-zinc-800">
                        <div>
                          <span className="text-xs uppercase font-mono font-bold text-zinc-500">Audit Record</span>
                          <h3 className="text-xl font-bold text-white mt-1 font-display">"{historyModalItem.claim}"</h3>
                        </div>
                        <button
                          onClick={() => setHistoryModalItem(null)}
                          className="p-2 rounded-lg text-zinc-400 hover:text-white hover:bg-zinc-900"
                        >
                          <Icon name="x" className="w-5 h-5" />
                        </button>
                      </div>

                      <div className="flex items-center justify-between gap-4 p-5 rounded-xl bg-black border border-zinc-800">
                        <VerdictBadge verdict={historyModalItem.verdict} size="md" />
                        <div className="text-right font-mono">
                          <div className="text-xs text-zinc-500">Confidence</div>
                          <div className="text-xl font-bold text-white">{historyModalItem.confidence_score}%</div>
                        </div>
                      </div>

                      <div>
                        <h4 className="text-xs uppercase font-mono font-bold text-zinc-400 tracking-wider mb-2">Verdict Rationale</h4>
                        <p className="text-base text-zinc-200 leading-relaxed font-sans">{historyModalItem.explanation}</p>
                      </div>

                      {historyModalItem.key_reasoning && (
                        <div className="p-5 rounded-xl bg-black border border-zinc-850 text-sm text-zinc-300 font-sans">
                          <span className="font-bold text-zinc-400 uppercase font-mono block mb-1.5">Key Reasoning:</span>
                          {historyModalItem.key_reasoning}
                        </div>
                      )}

                      <div className="flex items-center justify-between pt-4 border-t border-zinc-800">
                        <button
                          onClick={() => handleCopyWhatsAppReport(historyModalItem)}
                          className="px-4 py-2 rounded-xl bg-zinc-900 hover:bg-zinc-800 text-white text-xs font-bold font-mono border border-zinc-700 flex items-center gap-2"
                        >
                          <Icon name="copy" className="w-3.5 h-3.5" />
                          <span>Copy WhatsApp Report</span>
                        </button>
                        <button
                          onClick={() => setHistoryModalItem(null)}
                          className="px-6 py-2.5 rounded-xl bg-white text-black hover:bg-zinc-200 text-xs font-bold font-mono"
                        >
                          Close Record
                        </button>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* ======================================================== */}
            {/* TAB 4: ANALYTICS DASHBOARD                               */}
            {/* ======================================================== */}
            {activeTab === 'analytics' && analytics && (
              <div className="max-w-6xl mx-auto space-y-8">
                <div>
                  <h2 className="text-3xl font-bold text-white font-display">Verification Analytics</h2>
                  <p className="text-base text-zinc-400 mt-1 font-sans">
                    Distribution statistics, model confidence metrics, and knowledge vault coverage.
                  </p>
                </div>

                {/* KPI Cards */}
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-5">
                  <div className="hud-card rounded-2xl p-6">
                    <div className="text-xs text-zinc-500 font-mono uppercase">Total Checks</div>
                    <div className="text-4xl font-black text-white font-mono mt-2">{analytics.total_claims_verified}</div>
                  </div>
                  <div className="hud-card rounded-2xl p-6">
                    <div className="text-xs text-zinc-500 font-mono uppercase">Avg Confidence</div>
                    <div className="text-4xl font-black text-white font-mono mt-2">{analytics.average_confidence}%</div>
                  </div>
                  <div className="hud-card rounded-2xl p-6">
                    <div className="text-xs text-zinc-500 font-mono uppercase">Avg Credibility</div>
                    <div className="text-4xl font-black text-white font-mono mt-2">{analytics.average_source_credibility}%</div>
                  </div>
                  <div className="hud-card rounded-2xl p-6">
                    <div className="text-xs text-zinc-500 font-mono uppercase">Vault Chunks</div>
                    <div className="text-4xl font-black text-white font-mono mt-2">{analytics.total_chunks}</div>
                  </div>
                </div>

                {/* Visualizations */}
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                  {/* Doughnut Chart */}
                  <div className="hud-card rounded-2xl p-6 sm:p-8">
                    <h3 className="text-xs font-mono font-bold text-zinc-300 uppercase tracking-widest mb-5">
                      Verdict Distribution
                    </h3>
                    <div className="w-full max-w-sm mx-auto">
                      <canvas ref={chartRef1}></canvas>
                    </div>
                  </div>

                  {/* Top Sources */}
                  <div className="hud-card rounded-2xl p-6 sm:p-8">
                    <h3 className="text-xs font-mono font-bold text-zinc-300 uppercase tracking-widest mb-5">
                      Top Authoritative Sources
                    </h3>
                    <div className="space-y-3.5 font-mono">
                      {analytics.top_sources?.map((src, idx) => (
                        <div key={idx} className="p-4 rounded-xl bg-black border border-zinc-850 flex items-center justify-between">
                          <div>
                            <div className="text-sm font-bold text-white">{src.source}</div>
                            <div className="text-xs text-zinc-500 mt-0.5">{src.source_type}</div>
                          </div>
                          <span className="px-3 py-1 rounded bg-zinc-900 border border-zinc-800 text-white text-xs font-bold">
                            {src.doc_count} doc(s)
                          </span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* ======================================================== */}
            {/* TAB 5: ENGINE CONFIGURATION                              */}
            {/* ======================================================== */}
            {activeTab === 'settings' && (
              <div className="max-w-4xl mx-auto space-y-8">
                <div>
                  <h2 className="text-3xl font-bold text-white font-display">Engine Settings</h2>
                  <p className="text-base text-zinc-400 mt-1 font-sans">
                    Configure LLM reasoning provider, enter custom API keys, or inspect runtime diagnostics.
                  </p>
                </div>

                <div className="hud-card rounded-2xl p-6 sm:p-10 space-y-8">
                  <div>
                    <label className="text-xs sm:text-sm font-mono font-bold text-zinc-400 uppercase tracking-widest block mb-3">
                      Reasoning Provider
                    </label>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 font-mono">
                      {[
                        { id: 'auto', name: 'Auto-Select', desc: 'Detects configured keys or offline' },
                        { id: 'offline', name: 'Offline NLI Engine', desc: 'Zero-dependency local reasoner' },
                        { id: 'gemini', name: 'Google Gemini', desc: 'Gemini 2.0 / 1.5 Flash' },
                        { id: 'groq', name: 'Groq Cloud', desc: 'Llama 3.3 70B' },
                        { id: 'openai', name: 'OpenAI GPT', desc: 'GPT-4o-mini' },
                      ].map((p) => (
                        <button
                          key={p.id}
                          onClick={() => setSelectedProvider(p.id)}
                          className={`p-4 rounded-xl border text-left transition-all ${
                            selectedProvider === p.id 
                              ? 'bg-white text-black border-white shadow-sm' 
                              : 'bg-black border-zinc-850 text-zinc-400 hover:text-white hover:border-zinc-700'
                          }`}
                        >
                          <div className="text-sm font-bold">{p.name}</div>
                          <div className={`text-xs mt-1 ${selectedProvider === p.id ? 'text-zinc-700' : 'text-zinc-600'}`}>{p.desc}</div>
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="text-xs sm:text-sm font-mono font-bold text-zinc-400 uppercase tracking-widest block mb-3">
                      Custom API Key (Optional)
                    </label>
                    <input
                      type="password"
                      value={apiKeyInput}
                      onChange={(e) => {
                        setApiKeyInput(e.target.value);
                        localStorage.setItem('truthlens_api_key', e.target.value);
                      }}
                      placeholder="e.g. AIzaSy... or gsk_... or sk-..."
                      className="w-full bg-black rounded-xl px-5 py-3 text-base text-zinc-100 placeholder-zinc-700 border border-zinc-800 focus:outline-none focus:border-white font-mono"
                    />
                    <p className="text-xs text-zinc-500 mt-2 font-mono">
                      Keys are saved in local browser storage only for this session. Leave blank to use the built-in Offline NLI Engine.
                    </p>
                  </div>

                  {/* Architecture Diagnostics */}
                  <div className="pt-6 border-t border-zinc-850 space-y-4 font-mono">
                    <h4 className="text-xs sm:text-sm font-bold uppercase tracking-widest text-zinc-400">
                      System Architecture & Pipeline Status
                    </h4>
                    <div className="grid grid-cols-2 gap-4 text-xs sm:text-sm">
                      <div className="p-4 rounded-xl bg-black border border-zinc-850">
                        <div className="text-zinc-600">Vector Database</div>
                        <div className="text-white font-bold mt-1">ChromaDB Persistent (HNSW)</div>
                      </div>
                      <div className="p-4 rounded-xl bg-black border border-zinc-850">
                        <div className="text-zinc-600">Embedding Model</div>
                        <div className="text-white font-bold mt-1">all-MiniLM-L6-v2 (384-dim)</div>
                      </div>
                      <div className="p-4 rounded-xl bg-black border border-zinc-850">
                        <div className="text-zinc-600">Reranker Architecture</div>
                        <div className="text-white font-bold mt-1">Hybrid Semantic + Lexical</div>
                      </div>
                      <div className="p-4 rounded-xl bg-black border border-zinc-850">
                        <div className="text-zinc-600">Persistence Layer</div>
                        <div className="text-white font-bold mt-1">SQLite Thread-Safe Registry</div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* Minimalist Monochrome Footer */}
          <footer className="border-t border-zinc-850 bg-black py-8 text-center text-xs text-zinc-600 font-mono">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-2">
                <Icon name="shield" className="w-4 h-4 text-white" />
                <span className="font-bold text-zinc-300 font-display">TRUTHLENS</span>
                <span>— Explainable Retrieval-Augmented Generation</span>
              </div>
              <div className="text-zinc-500 text-xs font-mono">
                St. Francis Institute of Technology • Department of AI & Data Science
              </div>
            </div>
          </footer>
        </div>
      );
    }

    // Render the React application
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
