<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TruthLens — Explainable Fact Verification Engine</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              black: '#000000',
              deep: '#070709',
              card: '#0c0c0e',
              border: '#1f1f23',
              borderHover: '#333338',
              muted: '#71717a',
              subtext: '#a1a1aa',
              light: '#f4f4f5',
              white: '#ffffff'
            }
          }
        }
      }
    }
  </script>

  <!-- React 18, ReactDOM & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      background-color: #000000;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.04) 0%, transparent 60%),
        radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 100% 100%, 28px 28px;
      background-attachment: fixed;
    }
    .mono-card {
      background: rgba(12, 12, 14, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.09);
    }
    .mono-card:hover {
      border-color: rgba(255, 255, 255, 0.2);
    }
    .hero-gradient-text {
      background: linear-gradient(180deg, #FFFFFF 0%, #D4D4D8 60%, #71717A 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtle-shimmer {
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.05) 50%, transparent 100%);
      background-size: 200% 100%;
      animation: shimmer 3s infinite;
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #000000; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
  </style>
</head>
<body class="text-zinc-100 min-h-screen antialiased selection:bg-white selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Minimalist Professional SVG Icons ---
    const Icon = ({ name, className = "w-4 h-4" }) => {
      switch (name) {
        case 'shield':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>;
        case 'database':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4" /></svg>;
        case 'history':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;
        case 'chart':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>;
        case 'settings':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>;
        case 'check':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 13l4 4L19 7" /></svg>;
        case 'x':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M6 18L18 6M6 6l12 12" /></svg>;
        case 'alert':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>;
        case 'help':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;
        case 'trash':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>;
        case 'upload':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>;
        case 'sparkles':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>;
        case 'chevron-down':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" /></svg>;
        case 'chevron-up':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 15l7-7 7 7" /></svg>;
        case 'arrow-right':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>;
        default:
          return null;
      }
    };

    // --- Modern Refined Verdict Badge ---
    function VerdictBadge({ verdict, size = 'md' }) {
      const v = (verdict || 'INSUFFICIENT EVIDENCE').toUpperCase();
      const configs = {
        'SUPPORTED': {
          border: 'border-emerald-500/30',
          bg: 'bg-emerald-950/20',
          text: 'text-emerald-300',
          glow: 'bg-emerald-500',
          iconName: 'check',
          label: 'SUPPORTED',
          desc: 'Corroborated by verified evidence in the knowledge base.'
        },
        'REFUTED': {
          border: 'border-rose-500/30',
          bg: 'bg-rose-950/20',
          text: 'text-rose-300',
          glow: 'bg-rose-500',
          iconName: 'x',
          label: 'REFUTED',
          desc: 'Contradicted by factual data in authoritative records.'
        },
        'MISLEADING': {
          border: 'border-amber-500/30',
          bg: 'bg-amber-950/20',
          text: 'text-amber-300',
          glow: 'bg-amber-500',
          iconName: 'alert',
          label: 'MISLEADING',
          desc: 'Partially true or factual, but missing essential context or caveats.'
        },
        'INSUFFICIENT EVIDENCE': {
          border: 'border-zinc-700',
          bg: 'bg-zinc-900/60',
          text: 'text-zinc-300',
          glow: 'bg-zinc-400',
          iconName: 'help',
          label: 'INSUFFICIENT EVIDENCE',
          desc: 'Knowledge base lacks decisive reports to confirm or disprove.'
        }
      };

      const cfg = configs[v] || configs['INSUFFICIENT EVIDENCE'];

      if (size === 'lg') {
        return (
          <div className={`flex items-center gap-4 px-6 py-4 rounded-2xl border ${cfg.border} ${cfg.bg} transition-all`}>
            <div className="w-11 h-11 rounded-xl bg-black border border-zinc-800 flex items-center justify-center shrink-0">
              <span className={`w-2.5 h-2.5 rounded-full ${cfg.glow} shadow-sm mr-1`}></span>
              <Icon name={cfg.iconName} className={`w-5 h-5 ${cfg.text}`} />
            </div>
            <div>
              <div className={`text-xl sm:text-2xl font-black tracking-wider uppercase font-mono ${cfg.text}`}>
                {cfg.label}
              </div>
              <div className="text-xs text-zinc-400 font-medium mt-0.5">{cfg.desc}</div>
            </div>
          </div>
        );
      }

      return (
        <span className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-lg border text-xs font-bold tracking-wider font-mono ${cfg.border} ${cfg.bg} ${cfg.text}`}>
          <span className={`w-1.5 h-1.5 rounded-full ${cfg.glow}`}></span>
          {cfg.label}
        </span>
      );
    }

    // --- Sleek Evidence Chunk Card ---
    function EvidenceChunkCard({ chunk }) {
      const [expanded, setExpanded] = useState(false);
      const stance = chunk.stance || 'NEUTRAL';
      const text = chunk.text || '';
      const isLong = text.length > 240;

      const styles = {
        'SUPPORTING': {
          border: 'border-zinc-800 hover:border-emerald-500/40',
          tag: 'bg-emerald-950/30 text-emerald-300 border-emerald-500/30',
          icon: 'check',
          label: 'Supporting Evidence'
        },
        'CONTRADICTING': {
          border: 'border-zinc-800 hover:border-rose-500/40',
          tag: 'bg-rose-950/30 text-rose-300 border-rose-500/30',
          icon: 'x',
          label: 'Contradicting Evidence'
        },
        'NEUTRAL': {
          border: 'border-zinc-850 hover:border-zinc-700',
          tag: 'bg-zinc-900 text-zinc-400 border-zinc-800',
          icon: 'help',
          label: 'Contextual Reference'
        }
      };

      const s = styles[stance] || styles['NEUTRAL'];

      return (
        <div className={`p-4 rounded-xl bg-brand-card/90 border ${s.border} transition-all duration-200`}>
          <div className="flex items-center justify-between gap-2 pb-3 mb-3 border-b border-zinc-800/80">
            <span className={`inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-md border text-xs font-medium font-mono ${s.tag}`}>
              <Icon name={s.icon} className="w-3 h-3" />
              {s.label}
            </span>
            <div className="flex items-center gap-2 text-xs">
              <span className="font-mono text-white font-bold">{chunk.relevance_score}% Relevance</span>
              <span className="text-zinc-700">|</span>
              <span className="px-2 py-0.5 rounded bg-zinc-900 border border-zinc-800 text-zinc-300 text-[11px] font-mono">
                {chunk.source_type}
              </span>
            </div>
          </div>

          <p className="text-sm text-zinc-300 leading-relaxed font-normal">
            {expanded || !isLong ? text : `${text.slice(0, 240)}...`}
          </p>

          {isLong && (
            <button 
              onClick={() => setExpanded(!expanded)}
              className="mt-2 text-xs text-white hover:text-zinc-300 font-medium inline-flex items-center gap-1 underline underline-offset-4"
            >
              {expanded ? <>Show less <Icon name="chevron-up" className="w-3 h-3" /></> : <>Read complete chunk <Icon name="chevron-down" className="w-3 h-3" /></>}
            </button>
          )}

          <div className="mt-3 pt-2.5 border-t border-zinc-900 flex items-center justify-between text-[11px] text-zinc-500">
            <span className="truncate max-w-[75%] font-mono text-zinc-400">
              Source: <strong className="text-zinc-200">{chunk.source}</strong> {chunk.page_number && `(p. ${chunk.page_number})`}
            </span>
            <span className="font-mono text-zinc-600 uppercase">ID: {chunk.chunk_id?.slice(-6)}</span>
          </div>
        </div>
      );
    }

    // --- Main Application Component ---
    function App() {
      const [activeTab, setActiveTab] = useState('verify');
      const [claimInput, setClaimInput] = useState('');
      const [verifying, setVerifying] = useState(false);
      const [progressStep, setProgressStep] = useState(0);
      const [currentResult, setCurrentResult] = useState(null);
      const [documents, setDocuments] = useState([]);
      const [history, setHistory] = useState([]);
      const [analytics, setAnalytics] = useState(null);
      const [health, setHealth] = useState({ indexed_chunks: 0 });
      const [seeding, setSeeding] = useState(false);
      const [historyModalItem, setHistoryModalItem] = useState(null);
      const [selectedProvider, setSelectedProvider] = useState('auto');
      const [apiKeyInput, setApiKeyInput] = useState(localStorage.getItem('truthlens_api_key') || '');
      const [historyFilter, setHistoryFilter] = useState('ALL');
      const [toast, setToast] = useState(null);
      
      const chartRef1 = useRef(null);
      const chartInstance1 = useRef(null);

      const showToast = (msg, type = 'info') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 4000);
      };

      // Load initial state
      useEffect(() => {
        loadHealth();
        loadDocuments();
        loadHistory();
        loadAnalytics();
      }, []);

      const loadHealth = async () => {
        try {
          const res = await fetch('/health');
          const data = await res.json();
          setHealth(data);
        } catch (e) {
          console.error(e);
        }
      };

      const loadDocuments = async () => {
        try {
          const res = await fetch('/api/documents');
          const data = await res.json();
          setDocuments(data);
        } catch (e) {
          console.error(e);
        }
      };

      const loadHistory = async () => {
        try {
          const res = await fetch('/api/history?limit=50');
          const data = await res.json();
          setHistory(data);
        } catch (e) {
          console.error(e);
        }
      };

      const loadAnalytics = async () => {
        try {
          const res = await fetch('/api/analytics');
          const data = await res.json();
          setAnalytics(data);
        } catch (e) {
          console.error(e);
        }
      };

      // Handle Claim Verification
      const handleVerify = async (claimToVerify) => {
        const text = (claimToVerify || claimInput).trim();
        if (!text) {
          showToast('Please enter a claim or statement to verify.', 'error');
          return;
        }

        setVerifying(true);
        setCurrentResult(null);
        setProgressStep(1);

        const stepTimer1 = setTimeout(() => setProgressStep(2), 400);
        const stepTimer2 = setTimeout(() => setProgressStep(3), 900);
        const stepTimer3 = setTimeout(() => setProgressStep(4), 1400);

        try {
          const res = await fetch('/api/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              claim: text,
              llm_provider: selectedProvider,
              api_key: apiKeyInput || null
            })
          });

          if (!res.ok) {
            const err = await res.json();
            throw new Error(err.detail || 'Verification failed');
          }

          const data = await res.json();
          setCurrentResult(data);
          loadHealth();
          loadHistory();
          loadAnalytics();
          showToast(`Verification completed: ${data.verdict}`, 'success');
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          clearTimeout(stepTimer1);
          clearTimeout(stepTimer2);
          clearTimeout(stepTimer3);
          setVerifying(false);
          setProgressStep(0);
        }
      };

      // Handle Knowledge Base Seeding
      const handleSeed = async () => {
        setSeeding(true);
        try {
          const res = await fetch('/api/seed', { method: 'POST' });
          const data = await res.json();
          showToast(data.message, 'success');
          loadHealth();
          loadDocuments();
          loadAnalytics();
        } catch (err) {
          showToast('Failed to seed knowledge base: ' + err.message, 'error');
        } finally {
          setSeeding(false);
        }
      };

      // Handle Document Upload
      const handleFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const formData = new FormData();
        formData.append('file', file);
        formData.append('source_name', file.name.replace(/\.[^/.]+$/, ''));

        showToast(`Chunking and embedding ${file.name}...`, 'info');
        try {
          const res = await fetch('/api/upload', {
            method: 'POST',
            body: formData
          });
          const data = await res.json();
          showToast(`Indexed ${data.filename} (${data.chunks_indexed} chunks)`, 'success');
          loadHealth();
          loadDocuments();
          loadAnalytics();
        } catch (err) {
          showToast('Upload failed: ' + err.message, 'error');
        }
      };

      // Handle Delete Document
      const handleDeleteDoc = async (id, name) => {
        if (!confirm(`Delete ${name} and remove its vectors from the vault?`)) return;
        try {
          await fetch(`/api/documents/${id}`, { method: 'DELETE' });
          showToast(`Deleted ${name}`, 'success');
          loadHealth();
          loadDocuments();
          loadAnalytics();
        } catch (err) {
          showToast('Delete failed: ' + err.message, 'error');
        }
      };

      // Render Monochrome Analytics Chart
      useEffect(() => {
        if (activeTab === 'analytics' && analytics && chartRef1.current) {
          if (chartInstance1.current) {
            chartInstance1.current.destroy();
          }

          const ctx = chartRef1.current.getContext('2d');
          chartInstance1.current = new Chart(ctx, {
            type: 'doughnut',
            data: {
              labels: ['SUPPORTED', 'REFUTED', 'MISLEADING', 'INSUFFICIENT EVIDENCE'],
              datasets: [{
                data: [
                  analytics.verdict_counts.SUPPORTED || 0,
                  analytics.verdict_counts.REFUTED || 0,
                  analytics.verdict_counts.MISLEADING || 0,
                  analytics.verdict_counts['INSUFFICIENT EVIDENCE'] || 0
                ],
                backgroundColor: ['#ffffff', '#a1a1aa', '#52525b', '#27272a'],
                borderWidth: 2,
                borderColor: '#000000'
              }]
            },
            options: {
              responsive: true,
              plugins: {
                legend: {
                  position: 'bottom',
                  labels: { color: '#a1a1aa', font: { family: 'JetBrains Mono', size: 11 }, boxWidth: 12 }
                }
              },
              cutout: '72%'
            }
          });
        }
      }, [activeTab, analytics]);

      // Example clickable suggestion claims
      const exampleClaims = [
        "India became the world's third-largest economy in 2025.",
        "Renewable energy accounts for over 30 percent of global electricity.",
        "Antibiotics can cure viral infections like the flu.",
        "Frontier AI training compute has doubled roughly every 5-6 months since 2010.",
        "Flying saucers were discovered in the lost city of Atlantis."
      ];

      return (
        <div className="flex flex-col min-h-screen">
          {/* Toast Notification */}
          {toast && (
            <div className={`fixed bottom-6 right-6 z-50 px-4 py-3 rounded-xl border shadow-2xl flex items-center gap-3 backdrop-blur-2xl text-xs font-mono tracking-wide ${
              toast.type === 'error' ? 'bg-zinc-950 border-rose-500/50 text-rose-300' :
              toast.type === 'success' ? 'bg-zinc-950 border-white/40 text-white' :
              'bg-zinc-950 border-zinc-800 text-zinc-300'
            }`}>
              <Icon name={toast.type === 'error' ? 'x' : toast.type === 'success' ? 'check' : 'shield'} className="w-4 h-4" />
              <span>{toast.msg}</span>
            </div>
          )}

          {/* Top Navigation Bar */}
          <header className="sticky top-0 z-40 w-full border-b border-zinc-850 bg-black/85 backdrop-blur-2xl">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              
              {/* Brand Logo */}
              <div 
                onClick={() => setActiveTab('verify')}
                className="flex items-center gap-3 cursor-pointer group"
              >
                <div className="w-9 h-9 rounded-xl bg-zinc-900 border border-zinc-700 flex items-center justify-center group-hover:border-white transition-all shadow-sm">
                  <Icon name="shield" className="w-5 h-5 text-white" />
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-extrabold text-base tracking-tight text-white font-mono">
                      TruthLens
                    </span>
                    <span className="text-[10px] uppercase font-mono font-bold tracking-widest px-1.5 py-0.5 rounded bg-zinc-900 text-zinc-400 border border-zinc-800">
                      RAG Engine
                    </span>
                  </div>
                </div>
              </div>

              {/* Navigation Tabs */}
              <nav className="flex items-center gap-1 sm:gap-2">
                {[
                  { id: 'verify', label: 'Verify Claim', icon: 'shield' },
                  { id: 'knowledge', label: 'Knowledge Vault', icon: 'database' },
                  { id: 'history', label: 'Audit History', icon: 'history' },
                  { id: 'analytics', label: 'Analytics', icon: 'chart' },
                  { id: 'settings', label: 'Settings', icon: 'settings' },
                ].map((t) => (
                  <button

                                  >
                                    Inspect
                                  </button>
                                </td>
                              </tr>
                            ))}
                        </tbody>
                      </table>
                    </div>
                  ) : (
                    <div className="text-center py-8 text-xs text-zinc-600 font-mono">
                      No verification logs recorded yet.
                    </div>
                  )}
                </div>

                {/* Record Inspection Modal */}
                {historyModalItem && (
                  <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
                    <div className="mono-card rounded-2xl max-w-2xl w-full max-h-[85vh] overflow-y-auto p-6 sm:p-8 space-y-5 border-zinc-700 shadow-2xl relative">
                      <div className="flex items-start justify-between gap-4 pb-4 border-b border-zinc-800">
                        <div>
                          <span className="text-xs uppercase font-mono font-bold text-zinc-500">Audit Record</span>
                          <h3 className="text-lg font-bold text-white mt-1 font-sans">"{historyModalItem.claim}"</h3>
                        </div>
                        <button
                          onClick={() => setHistoryModalItem(null)}
                          className="p-1 rounded-lg text-zinc-400 hover:text-white hover:bg-zinc-900"
                        >
                          <Icon name="x" className="w-5 h-5" />
                        </button>
                      </div>

                      <div className="flex items-center justify-between gap-4 p-4 rounded-xl bg-black border border-zinc-800">
                        <VerdictBadge verdict={historyModalItem.verdict} size="md" />
                        <div className="text-right font-mono">
                          <div className="text-xs text-zinc-500">Confidence</div>
                          <div className="text-lg font-bold text-white">{historyModalItem.confidence_score}%</div>
                        </div>
                      </div>

                      <div>
                        <h4 className="text-xs uppercase font-mono font-bold text-zinc-400 tracking-wider mb-1.5">Verdict Rationale</h4>
                        <p className="text-sm text-zinc-200 leading-relaxed font-sans">{historyModalItem.explanation}</p>
                      </div>

                      {historyModalItem.key_reasoning && (
                        <div className="p-4 rounded-xl bg-black border border-zinc-850 text-xs text-zinc-300 font-sans">
                          <span className="font-bold text-zinc-400 uppercase font-mono block mb-1">Key Reasoning:</span>
                          {historyModalItem.key_reasoning}
                        </div>
                      )}

                      <div className="flex justify-end pt-4 border-t border-zinc-800">
                        <button
                          onClick={() => setHistoryModalItem(null)}
                          className="px-4 py-2 rounded-xl bg-white text-black hover:bg-zinc-200 text-xs font-bold font-mono"
                        >
                          Close Record
                        </button>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* ======================================================== */}
            {/* TAB 4: ANALYTICS DASHBOARD                               */}
            {/* ======================================================== */}
            {activeTab === 'analytics' && analytics && (
              <div className="max-w-4xl mx-auto space-y-6">
                <div>
                  <h2 className="text-2xl font-bold text-white font-sans">Verification Analytics</h2>
                  <p className="text-sm text-zinc-400">
                    Distribution statistics, model confidence metrics, and knowledge base coverage.
                  </p>
                </div>

                {/* KPI Cards */}
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                  <div className="mono-card rounded-2xl p-5">
                    <div className="text-xs text-zinc-500 font-mono uppercase">Total Checks</div>
                    <div className="text-3xl font-black text-white font-mono mt-1">{analytics.total_claims_verified}</div>
                  </div>
                  <div className="mono-card rounded-2xl p-5">
                    <div className="text-xs text-zinc-500 font-mono uppercase">Avg Confidence</div>
                    <div className="text-3xl font-black text-white font-mono mt-1">{analytics.average_confidence}%</div>
                  </div>
                  <div className="mono-card rounded-2xl p-5">
                    <div className="text-xs text-zinc-500 font-mono uppercase">Avg Credibility</div>
                    <div className="text-3xl font-black text-white font-mono mt-1">{analytics.average_source_credibility}%</div>
                  </div>
                  <div className="mono-card rounded-2xl p-5">
                    <div className="text-xs text-zinc-500 font-mono uppercase">Vault Chunks</div>
                    <div className="text-3xl font-black text-white font-mono mt-1">{analytics.total_chunks}</div>
                  </div>
                </div>

                {/* Visualizations */}
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                  {/* Doughnut Chart */}
                  <div className="mono-card rounded-2xl p-6">
                    <h3 className="text-xs font-mono font-bold text-zinc-300 uppercase tracking-widest mb-4">
                      Verdict Distribution
                    </h3>
                    <div className="w-full max-w-xs mx-auto">
                      <canvas ref={chartRef1}></canvas>
                    </div>
                  </div>

                  {/* Top Sources */}
                  <div className="mono-card rounded-2xl p-6">
                    <h3 className="text-xs font-mono font-bold text-zinc-300 uppercase tracking-widest mb-4">
                      Top Authoritative Sources
                    </h3>
                    <div className="space-y-3 font-mono">
                      {analytics.top_sources?.map((src, idx) => (
                        <div key={idx} className="p-3 rounded-xl bg-black border border-zinc-850 flex items-center justify-between">
                          <div>
                            <div className="text-xs font-bold text-white">{src.source}</div>
                            <div className="text-[11px] text-zinc-500">{src.source_type}</div>
                          </div>
                          <span className="px-2 py-1 rounded bg-zinc-900 border border-zinc-800 text-white text-xs font-bold">
                            {src.doc_count} doc(s)
                          </span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* ======================================================== */}
            {/* TAB 5: ENGINE CONFIGURATION                              */}
            {/* ======================================================== */}
            {activeTab === 'settings' && (
              <div className="max-w-3xl mx-auto space-y-6">
                <div>
                  <h2 className="text-2xl font-bold text-white font-sans">Engine Settings</h2>
                  <p className="text-sm text-zinc-400">
                    Configure LLM reasoning provider, enter custom API keys, or inspect runtime diagnostics.
                  </p>
                </div>

                <div className="mono-card rounded-2xl p-6 sm:p-8 space-y-6">
                  <div>
                    <label className="text-xs font-mono font-bold text-zinc-400 uppercase tracking-widest block mb-2">
                      Reasoning Provider
                    </label>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 font-mono">
                      {[
                        { id: 'auto', name: 'Auto-Select', desc: 'Detects configured keys or offline' },
                        { id: 'offline', name: 'Offline NLI Engine', desc: 'Zero-dependency local reasoner' },
                        { id: 'gemini', name: 'Google Gemini', desc: 'Gemini 2.0 / 1.5 Flash' },
                        { id: 'groq', name: 'Groq Cloud', desc: 'Llama 3.3 70B' },
                        { id: 'openai', name: 'OpenAI GPT', desc: 'GPT-4o-mini' },
                      ].map((p) => (
                        <button
                          key={p.id}
                          onClick={() => setSelectedProvider(p.id)}
                          className={`p-3 rounded-xl border text-left transition-all ${
                            selectedProvider === p.id 
                              ? 'bg-white text-black border-white shadow-sm' 
                              : 'bg-black border-zinc-850 text-zinc-400 hover:text-white hover:border-zinc-700'
                          }`}
                        >
                          <div className="text-xs font-bold">{p.name}</div>
                          <div className={`text-[10px] mt-0.5 ${selectedProvider === p.id ? 'text-zinc-700' : 'text-zinc-600'}`}>{p.desc}</div>
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="text-xs font-mono font-bold text-zinc-400 uppercase tracking-widest block mb-2">
                      Custom API Key (Optional)
                    </label>
                    <input
                      type="password"
                      value={apiKeyInput}
                      onChange={(e) => {
                        setApiKeyInput(e.target.value);
                        localStorage.setItem('truthlens_api_key', e.target.value);
                      }}
                      placeholder="e.g. AIzaSy... or gsk_... or sk-..."
                      className="w-full bg-black rounded-xl px-4 py-2.5 text-sm text-zinc-100 placeholder-zinc-700 border border-zinc-800 focus:outline-none focus:border-white font-mono"
                    />
                    <p className="text-[11px] text-zinc-500 mt-1.5 font-mono">
                      Keys are saved in local browser storage only for this session. Leave blank to use the built-in Offline NLI Engine.
                    </p>
                  </div>

                  {/* Architecture Diagnostics */}
                  <div className="pt-4 border-t border-zinc-850 space-y-3 font-mono">
                    <h4 className="text-xs font-bold uppercase tracking-widest text-zinc-400">
                      System Architecture & Pipeline Status
                    </h4>
                    <div className="grid grid-cols-2 gap-3 text-xs">
                      <div className="p-3 rounded-xl bg-black border border-zinc-850">
                        <div className="text-zinc-600">Vector Database</div>
                        <div className="text-white font-bold mt-0.5">ChromaDB Persistent (HNSW)</div>
                      </div>
                      <div className="p-3 rounded-xl bg-black border border-zinc-850">
                        <div className="text-zinc-600">Embedding Model</div>
                        <div className="text-white font-bold mt-0.5">all-MiniLM-L6-v2 (384-dim)</div>
                      </div>
                      <div className="p-3 rounded-xl bg-black border border-zinc-850">
                        <div className="text-zinc-600">Reranker Architecture</div>
                        <div className="text-white font-bold mt-0.5">Hybrid Semantic + Lexical</div>
                      </div>
                      <div className="p-3 rounded-xl bg-black border border-zinc-850">
                        <div className="text-zinc-600">Persistence Layer</div>
                        <div className="text-white font-bold mt-0.5">SQLite Thread-Safe Registry</div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* Minimalist Monochrome Footer */}
          <footer className="border-t border-zinc-850 bg-black py-6 text-center text-xs text-zinc-600 font-mono">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3">
              <div className="flex items-center gap-2">
                <Icon name="shield" className="w-4 h-4 text-white" />
                <span className="font-bold text-zinc-300">TruthLens</span>
                <span>— Explainable Retrieval-Augmented Generation</span>
              </div>
              <div className="text-zinc-500 text-[11px]">
                St. Francis Institute of Technology • Department of AI & Data Science
              </div>
            </div>
          </footer>
        </div>
      );
    }

    // Render the React application
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
